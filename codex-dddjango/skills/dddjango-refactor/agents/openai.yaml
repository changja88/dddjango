interface:
  display_name: "dddjango-refactor"
  short_description: "대상 BC 하나의 기존 코드 전체를 dddjango 표준으로 정리(리팩토링 입구 — 바뀌는 동작 · DB 는 G1 목록 승인)"
  default_prompt: "Use $dddjango-refactor <bounded context> [pain points] to run the dddjango Coordinator in refactoring mode for one bounded context. Explicit invocation only."
policy:
  allow_implicit_invocation: false
