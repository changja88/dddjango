<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>독립 평가용 원본</title><link rel="stylesheet" href="styles/base.css"><style>body { color: #24324a; font-size: 15px; } h1 { font-size: 25px; }</style><script defer src="steps.js"></script></head>
<body><main class="frame" data-flow>
<header class="intro"><img class="mark" src="assets/mark.png" width="64" height="64" alt="파란 마름모"><p class="eyebrow">독립 평가용 원본</p><h1>나의 기록을 준비해요</h1><p class="subtitle">세 가지를 확인하면 준비가 끝나요.</p></header>
<div class="progress" aria-label="진행 단계"><span data-progress="1" aria-current="step">1</span><i></i><span data-progress="2">2</span><i></i><span data-progress="3">3</span></div>
<section class="panel" data-step="1"><p class="step-label">STEP 01</p><h2>어떻게 불러드릴까요?</h2><label for="display-name">이름</label><input id="display-name" name="display-name" type="text" placeholder="사용할 이름을 입력하세요" autocomplete="off"><p class="hint">이름은 나중에도 바꿀 수 있어요.</p><button class="primary" data-next><span class="button-label">다음</span></button></section>
<section class="panel" data-step="2" hidden><p class="step-label">STEP 02</p><h2>어떤 분위기를 좋아하나요?</h2><p class="description">기록에 사용할 분위기를 선택해주세요.</p><fieldset><legend>분위기</legend><label class="choice"><input type="radio" name="mood" value="차분하게" checked><span>차분하게</span></label><label class="choice"><input type="radio" name="mood" value="밝게"><span>밝게</span></label></fieldset><div class="actions"><button class="secondary" data-prev>이전</button><button class="primary" data-next><span class="button-label">다음</span></button></div></section>
<section class="panel" data-step="3" hidden><p class="step-label">STEP 03</p><h2>선택한 내용을 확인해요</h2><dl><div><dt>이름</dt><dd data-name-summary></dd></div><div><dt>분위기</dt><dd data-mood-summary></dd></div></dl><div class="actions"><button class="secondary" data-prev>이전</button><button class="primary" data-finish><span class="button-label">완료</span></button></div></section>
<section class="panel complete" data-step="4" hidden><p class="step-label">READY</p><h2>준비가 끝났어요</h2><p class="description"><strong data-complete-name></strong>님의 기록을 기다릴게요.</p><button class="primary" data-restart><span class="button-label">다시 시작</span></button></section>
<footer><a href="#" data-footnote>설정 안내</a><span>·</span><a href="#" data-footnote>도움말</a></footer>
</main></body></html>
