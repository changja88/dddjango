{# 비밀번호 필드 그룹 — 토글 버튼은 JS 연결 전까지 hidden #}
<div class="ui-lab-password" id="{{ password.dom_id }}" data-password-visibility>
  <label class="ui-lab-password__label" for="{{ password.input_dom_id }}">{{ password.label }}</label>
  <input class="ui-lab-password__input"
         type="password"
         id="{{ password.input_dom_id }}"
         name="{{ password.input_name }}"
         autocomplete="{{ password.autocomplete }}"
         data-password-input>
  <button class="ui-lab-password__toggle"
          type="button"
          aria-pressed="false"
          aria-controls="{{ password.input_dom_id }}"
          data-password-toggle
          data-password-show-label="{{ password.show_label }}"
          data-password-hide-label="{{ password.hide_label }}"
          hidden>{{ password.show_label }}</button>
</div>
