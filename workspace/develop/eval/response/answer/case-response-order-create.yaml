id: case-response-order-create
case_id: case-response-order-create
bucket: response
kind: response
public_case: workspace/develop/eval/response/cases/plugin/public/case-response-order-create.md
intent: Validate specialist-positive reasoning for a risky order creation API without file edits.
reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: specialist-positive, risky DB/API, DDD dimensions
  - path: workspace/reference/architecture-ddd/reference/final.md
    basis: bounded context, aggregate, invariants, state transitions
  - path: workspace/reference/architecture-api/reference/final.md
    basis: REST contract, Problem Details, idempotency key semantics, OpenAPI impact
  - path: workspace/reference/architecture-db/reference/final.md
    basis: 제약조건, 중복 방지, 멱등성 저장소, 트랜잭션/락
  - path: workspace/reference/implementation-django-ninja/reference/final.md
    basis: Django Ninja Router/Schema boundary and API adapter expectations
  - path: workspace/reference/implementation-test/reference/final.md
    basis: API contract and concurrency test strategy
  - path: dddjango/skills/architecture-db/references/transactions-locking.md
    basis: risky write consistency, idempotency storage, isolation/retry, side-effect timing handoff
  - path: dddjango/skills/architecture-db/references/constraints-indexes.md
    basis: unique constraint와 duplicate prevention
  - path: dddjango/skills/architecture-api/references/idempotency-openapi.md
    basis: Idempotency-Key replay/conflict handoff and OpenAPI impact
  - path: dddjango/skills/implementation-django/references/transactions-performance-security.md
    basis: transaction.atomic, on_commit side-effect timing, and Django verification honesty
  - path: dddjango/skills/implementation-django-ninja/references/problem-details-openapi.md
    basis: Problem Details and OpenAPI response mapping
  - path: dddjango/skills/implementation-test/references/django-api-concurrency.md
    basis: API and concurrency verification criteria
target_behavior:
  required:
    - Starts from DDD terms, bounded context, aggregate, invariants, and state transitions before tactical code patterns.
    - Defines REST/Django Ninja contract with Problem Details, OpenAPI impact, auth assumption, and idempotency key semantics.
    - Discusses DB uniqueness/idempotency storage, transaction boundary, locking or retry tradeoff, and side effect timing after commit.
    - Gives domain/API/test verification plan without claiming commands were run.
  forbidden:
    - Recommending DRF ViewSet/Serializer as greenfield standard.
    - Placing business rules in Router or treating repository/UoW as mandatory without need.
scoring_checks:
  - pass if DDD, DB, API, Django Ninja, and tests are all connected through the same order invariant.
  - fail if it only lists skills or patterns without an order-specific consistency decision.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - tactical-pattern-first answer
  - body-field idempotency without replay/conflict semantics
  - false verification claim
leakage_checks:
  - public response must not mention answer path, private scoring text, or prior run notes.
evidence_required:
  - public prompt packet
  - baseline and with-dddjango response
  - baseline isolation artifact
  - with-dddjango prompt-input artifact
  - command, exit code, event stream, and stderr
  - answer-oracle evaluation notes
  - machine-readable answer-oracle evaluation artifact
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - specialist-positive
  - strategic-ddd
  - db-api-architecture
  - validation-plan-order-create
  - risky-write-consistency
