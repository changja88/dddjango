target_behavior:
  required:
    - Separates architecture-api ownership of resource, method, status code, Problem Details, auth assumptions, and OpenAPI impact from implementation-django-ninja ownership of thin Router/Schema mapping.
    - Separates architecture-db ownership of transaction policy, uniqueness, locking/retry, idempotency or duplicate prevention, and migration rollout risk from implementation-django ownership of concrete ORM/service/migration implementation.
    - Keeps `OrderService.confirm()` as the production implementation boundary for state transition and `transaction.on_commit()` timing; Router, template, test fixture, and review notes must not own the domain rule.
    - Routes server-rendered status badge, view context, template/static references, auth check placement, and render/browser/collectstatic honesty to implementation-django-web.
    - Routes `OrderStatus`, money display typing, dataclass/StrEnum choice, pydantic restraint, and typecheck honesty to implementation-python without forcing a heavy type layer.
    - Separates implementation-tdd's test list, first failing test, red-green-refactor checkpoint, and boundary case selection from implementation-test's pytest fixtures, factory, TestClient, concurrency, and assertion mechanics.
    - Uses implementation-cleancode as review responsibility for fat service, template business logic, naming, encapsulation, and responsibility split; it must not replace production implementation or test ownership.
    - Gives a handoff or ownership table that names each skill boundary and unresolved follow-up without claiming file edits, tests, browser checks, migrations, or subagent execution.
    - Resists full workflow/subagent execution unless explicitly framed as not executed or only a handoff plan.
  forbidden:
    - Writing code, migrations, tests, or file diffs despite the answer-only request.
    - Treating Django Ninja Router/Schema as owner of business rules, transaction policy, or DB duplicate prevention.
    - Letting template/static code decide order state transitions, permissions, or raw fallback logic.
    - Using pytest/TDD discussion as a substitute for production service/API/web implementation boundaries.
    - Claiming that tests, migrations, browser checks, collectstatic, type checks, or subagents were executed.
scoring_checks:
  - pass if the answer connects the same order-confirmation scenario across API, DB, Django service/migration, Ninja adapter, Web, Python typing, Clean Code, TDD, and pytest mechanics while keeping each ownership boundary distinct.
  - pass if unresolved DB/API/test/web verification is assigned to owning skills rather than silently decided by the wrong layer.
  - fail if it only lists skill names without order-specific handoff decisions.
  - fail if it treats P4 direct skill advice as sufficient and omits integration ownership or validation honesty.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, browser checks, migration generation, type checks, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - API adapter owns transaction or domain rule
  - DB rollout risk hidden inside Django migration prose
  - template business logic
  - pytest/TDD replaces production code boundary
  - clean-code review replaces implementation ownership
  - false verification or subagent claim
leakage_checks:
  - public response must not mention answer path, private scoring text, or prior run notes.
evidence_required:
  - public prompt packet
  - baseline and with-dddjango response
  - baseline isolation artifact
  - with-ddjango prompt-input artifact
  - command, exit code, event stream, and stderr
  - answer-oracle evaluation notes
  - machine-readable answer-oracle evaluation artifact
control_case: false
expected_outcomes:
