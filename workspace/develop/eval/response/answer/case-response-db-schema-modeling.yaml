id: case-response-db-schema-modeling
case_id: case-response-db-schema-modeling
bucket: response
kind: response
public_case: workspace/develop/eval/response/cases/plugin/public/case-response-db-schema-modeling.md
intent: architecture-db 단독 schema/ERD, key, constraint, index 설계 판단을 검증한다.
reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: DB/API architecture와 specialist-positive coverage
  - path: workspace/reference/architecture-db/reference/final.md
    basis: 데이터베이스 모델링 프로세스, ERD, 정규화, 제약조건, 인덱스
  - path: dddjango/skills/architecture-db/SKILL.md
    basis: relational DB architecture routing과 runtime rules
  - path: dddjango/skills/architecture-db/references/schema-modeling.md
    basis: conceptual/logical/physical modeling, keys, cardinality, optionality, normalization
  - path: dddjango/skills/architecture-db/references/constraints-indexes.md
    basis: PK/FK/unique/check/not-null, partial index, composite index, index write cost
target_behavior:
  required:
    - 업무 불변식과 query/write pattern에서 시작해 conceptual ERD, logical schema, physical constraint/index 순서로 답한다.
    - 회사, 지점, 회의실, 사용자, 예약 같은 entity와 관계의 cardinality/optionality를 구분한다.
    - PK 선택과 FK 관계, 취소 상태를 포함한 예약 중복 방지 제약을 DB가 강제할 수 있는 방식으로 설명한다.
    - soft-cancel 또는 취소 이력 보존과 재예약 가능성을 partial unique/exclusion constraint 또는 동등한 DB 제약 trade-off로 다룬다.
    - `회사 + 지점 + 날짜` 예약 목록과 사용자별 예정 예약 query shape에 맞는 composite/partial index 후보와 write cost를 함께 설명한다.
    - 정규화를 먼저 적용하고, derived column이나 denormalization은 필요할 때 consistency 유지 방법과 함께 제한적으로 언급한다.
    - Django migration 구현, API status code, 테스트 세부 구현은 다른 skill 책임으로 넘기거나 범위 밖으로 둔다.
  forbidden:
    - Django 모델 필드 코드나 migration class를 주된 산출물로 작성한다.
    - DB가 강제할 수 있는 예약 중복 방지를 애플리케이션 validation만으로 처리한다.
    - cardinality, optionality, key 선택 없이 테이블명만 나열한다.
    - 모든 컬럼에 index를 붙이거나 index write/storage cost를 숨긴다.
    - workflow role map, subagent plan, API 계약을 답변의 중심으로 둔다.
scoring_checks:
  - pass if schema/ERD, keys, constraints, indexes, normalization, and query shape are connected to the reservation invariant.
  - fail if the answer is mostly Django implementation or API design instead of DB architecture.
  - fail if overlapping reservation prevention is not protected by a DB-owned constraint or lock-aware design.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - ORM-convenience-first schema
  - missing cardinality or optionality
  - application-only duplicate prevention
  - index cost omitted
leakage_checks:
  - public response must not mention answer path, private scoring text, or prior run notes.
evidence_required:
  - public prompt packet
  - baseline and with-dddjango response
  - baseline isolation artifact
  - with-dddjango prompt-input artifact
  - command, exit code, event stream, and stderr
  - answer-oracle evaluation notes
  - machine-readable answer-oracle evaluation artifact
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - specialist-positive
  - db-architecture
  - schema-modeling
  - keys-cardinality-optionality
  - constraints-indexes
  - overapplication-restraint
