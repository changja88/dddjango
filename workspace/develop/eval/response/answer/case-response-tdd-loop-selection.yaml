intent: implementation-tdd 단일 skill의 TDD loop, approach selection, verification style, BDD/ATDD handoff, exclusion boundary를 검증한다.
reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: TDD/Test response scenario and validation honesty
  - path: workspace/reference/implementation-tdd/reference/final.md
    basis: TDD source reference for Red-Green-Refactor, test list, boundary cases, schools, verification style, BDD/ATDD, AI-assisted honesty
  - path: dddjango/skills/implementation-tdd/SKILL.md
