reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: Django implementation advice와 validation honesty
  - path: workspace/reference/implementation-django/reference/final.md
    basis: Django model, ORM, QuerySet/Manager, service/selector, transaction, caching, security, performance
