id: case-response-api-contract
case_id: case-response-api-contract
bucket: response
kind: response
public_case: workspace/develop/eval/response/cases/plugin/public/case-response-api-contract.md
intent: architecture-api 개별 skill이 REST 계약 전체 표면을 source reference 기반으로 설계하는지 검증한다.
reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: response bucket의 DB/API architecture와 specialist-positive 평가 목적
  - path: workspace/reference/architecture-api/reference/final.md
    basis: REST resource, method/status, Problem Details, headers, auth, pagination, versioning, rate limit, idempotency, OpenAPI source 기준
  - path: dddjango/skills/architecture-api/SKILL.md
    basis: architecture-api routing, runtime rules, handoff boundary
  - path: dddjango/skills/architecture-api/references/rest-contracts.md
    basis: resource/URL, method/status, request/response/header, auth/authz, content negotiation 기준
  - path: dddjango/skills/architecture-api/references/problem-details.md
    basis: RFC 9457 Problem Details 필드와 error mapping 기준
  - path: dddjango/skills/architecture-api/references/pagination-versioning.md
    basis: pagination, versioning/deprecation, rate limit 기준
  - path: dddjango/skills/architecture-api/references/idempotency-openapi.md
    basis: Idempotency-Key replay/conflict 계약과 OpenAPI 영향 기준
target_behavior:
  required:
    - 주문 목록, 주문 생성, 주문 상세를 stable noun resource와 plural lowercase URL로 나누고 query parameter는 filtering, sorting, sparse fieldset, pagination에 둔다.
    - endpoint별 HTTP method와 상태 코드를 구분하고, `201 Created`와 `Location`, `200 OK`, `400`/`401`/`403`/`404`/`409`/`422`/`429`를 요청 범위에 맞게 설명한다.
    - request body, path/query/header, response body/header를 상태 코드별로 분리하고 `Content-Type`, `Accept`, CSV negotiation, `WWW-Authenticate`, rate-limit/retry/idempotency 관련 헤더를 계약에 포함한다.
    - Problem Details는 `application/problem+json`, `type`, `title`, `status`, `detail`, `instance`, 필요한 extension field와 actual status 일치를 포함해 설계한다.
    - 인증과 인가를 분리하고 고객 self-access와 운영자 access의 authorization 조건 및 `401`/`403` 차이를 명시한다.
    - 자주 바뀌고 커지는 목록에는 cursor 또는 keyset pagination과 stable ordering, opaque cursor, bounded page size, `next_cursor` 또는 `has_more`를 제안한다.
    - additive field와 breaking change를 구분하고 versioning/deprecation 전략과 migration window 또는 sunset/deprecation 신호를 설명한다.
    - rate limit은 `429`, `Retry-After`, limit/remaining/reset 의미를 포함하고 알고리즘은 제품 요구에 맞춘 선택으로 둔다.
    - duplicate-sensitive POST에는 `Idempotency-Key` 요구 여부, key scope, same-key same-request replay, same-key different-request conflict, retention window, DB/test handoff를 분리한다.
    - OpenAPI에는 path/method/schema/status별 response, Problem Details, security, headers, pagination metadata, rate limit, idempotency, version/deprecation metadata를 반영한다고 말한다.
    - Django code, DB schema, pytest 구현은 하지 않고 필요한 경우 `architecture-db`, `implementation-django-ninja`, `implementation-test` handoff만 남긴다.
  forbidden:
    - Django Ninja Router, Schema, model, migration, pytest code를 작성한다.
    - `Idempotency-Key`를 단순 body field로만 처리하거나 replay/conflict semantics를 누락한다.
    - Problem Details를 일반 JSON error 문자열로 대체하거나 actual HTTP status와 problem `status` 일치를 무시한다.
    - content negotiation, pagination, versioning/deprecation, rate limit, OpenAPI 중 둘 이상을 생략한다.
    - 운영자와 고객 권한 차이를 인증 문제로만 처리한다.
scoring_checks:
  - pass if REST 계약 표면을 endpoint별로 구조화하고 reference의 주요 축을 모두 사용한다.
  - pass if 구현 상세는 handoff로 남기고 API-visible behavior만 직접 결정한다.
  - partial if idempotency와 Problem Details는 다루지만 pagination/versioning/rate-limit/header 계약이 약하다.
  - fail if Django 구현이나 DB schema 중심으로 답하거나 REST 계약 축 대부분을 누락한다.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - 구현 중심 답변
  - REST 계약 checklist 일부만 나열하고 endpoint별 status/header/body를 구분하지 않음
  - Idempotency-Key replay/conflict 누락
  - Problem Details status mismatch 또는 generic error envelope
  - OpenAPI 영향 누락
leakage_checks:
  - public response must not mention answer path, private scoring text, or prior run notes.
  - public response must not reveal evaluator-only field names from this YAML.
evidence_required:
  - baseline and with-dddjango response
  - baseline isolation artifact
  - answer-oracle evaluation notes
  - with-dddjango prompt-input artifact
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - specialist-positive
  - db-api-architecture
  - api-contract
  - architecture-api
  - rest-contract
  - resource-url
  - method-status
  - problem-details
  - auth-authz
  - content-negotiation
  - pagination
  - versioning-deprecation
  - rate-limit
  - idempotency
  - openapi-impact
  - validation-honesty
