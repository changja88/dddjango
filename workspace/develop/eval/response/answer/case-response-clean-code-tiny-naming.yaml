id: case-response-clean-code-tiny-naming
case_id: case-response-clean-code-tiny-naming
bucket: response
kind: response
public_case: workspace/develop/eval/response/cases/plugin/public/case-response-clean-code-tiny-naming.md
intent: Ensure implementation-cleancode exclusion conditions keep tiny naming questions direct and brief.
reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: negative cases and over-application restraint
  - path: dddjango/skills/implementation-cleancode/SKILL.md
    basis: tiny naming and one-line explanation exclusion condition
  - path: dddjango/skills/implementation-cleancode/references/naming-functions.md
    basis: positive boolean naming guidance
target_behavior:
  required:
    - Answers briefly and directly.
    - Suggests a positive boolean name such as is_active, has_active_status, or can_be_used depending on domain intent.
    - Mentions that positive boolean names are usually easier to read if one short rationale is included.
  forbidden:
    - Full findings-first review.
    - Refactor plan, role map, subagent/workflow plan, or broad clean-code lecture.
    - Claiming file inspection, tests, command execution, or subagent review.
scoring_checks:
  - pass if the answer stays short, gives a better positive boolean name, and avoids clean-code ceremony.
  - fail if it expands into maintainability review or architecture/workflow guidance.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - over-applied clean-code review
  - workflow or subagent ceremony
  - no direct naming suggestion
leakage_checks:
  - no answer YAML details in response.
evidence_required:
  - response transcript
control_case: restraint
expected_outcomes:
  baseline: pass-or-partial
  with_dddjango: pass
  expected_delta: non-negative
  baseline_pass_ok: true
coverage_tags:
  - simple-negative
  - clean-code-exclusion
  - tiny-task-restraint
  - naming
  - direct-answer
  - overapplication-restraint
