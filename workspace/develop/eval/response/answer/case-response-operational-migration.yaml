id: case-response-operational-migration
case_id: case-response-operational-migration
bucket: response
kind: response
public_case: workspace/develop/eval/response/cases/plugin/public/case-response-operational-migration.md
intent: Evaluate operational migration advice with DB and Django migration responsibility separation.
reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: risky DB/API and validation-plan representative scenarios
  - path: workspace/reference/architecture-db/reference/final.md
    basis: rollout constraints and indexes
  - path: dddjango/skills/architecture-db/SKILL.md
    basis: DB rollout risk와 Django migration implementation handoff boundary
  - path: dddjango/skills/architecture-db/references/rollout-constraints.md
    basis: expand/backfill/contract, lock/index risk, rollback or forward-fix
  - path: dddjango/skills/architecture-db/references/constraints-indexes.md
    basis: not-null, unique/check, index write cost and validation risk
  - path: workspace/reference/implementation-django/reference/final.md
    basis: migrations
  - path: dddjango/skills/implementation-django/SKILL.md
    basis: implementation-django migration routing, rollout verification honesty, and runtime rules
  - path: dddjango/skills/implementation-django/references/migrations.md
    basis: RunPython, historical models, sqlmigrate, backfill, expand/backfill/contract, rollback or forward-fix
target_behavior:
  required:
    - Uses expand/backfill/contract or equivalent rolling sequence.
    - Separates DB constraint/index risk from concrete Django migration implementation.
    - Mentions lock risk, batched backfill, nullable-to-not-null transition, index strategy, and rollback or forward-fix plan.
    - States commands to run only as planned or not yet run.
  forbidden:
    - One-shot NOT NULL backfill on a hot table without risk discussion.
    - Claiming sqlmigrate or migration tests were executed.
scoring_checks:
  - pass if the plan is operationally safe and specific to Django migrations.
  - fail if it is just a schema checklist.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - lock risk omitted
  - rollout compatibility omitted
  - false command result
leakage_checks:
  - no private run or answer material in response.
evidence_required:
  - public prompt packet
  - baseline and with-dddjango response
  - baseline isolation artifact
  - with-dddjango prompt-input artifact
  - command, exit code, event stream, and stderr
  - answer-oracle evaluation notes
  - machine-readable answer-oracle evaluation artifact
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - implementation-django
  - django-migration
  - operational-migration
  - migration-safety
  - db-consistency
  - validation-honesty
