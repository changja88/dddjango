id: case-response-test-suite-strategy
case_id: case-response-test-suite-strategy
bucket: response
kind: response
public_case: workspace/develop/eval/response/cases/plugin/public/case-response-test-suite-strategy.md
intent: implementation-test 개별 skill이 pytest/test implementation 설계 기준을 source reference 기반으로 직접 적용하는지 검증한다.
reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: TDD/Test response coverage and validation honesty
  - path: workspace/reference/implementation-test/reference/final.md
    basis: pytest, fixtures, doubles, factories, property tests, coverage, mutation, API contract, idempotency, concurrency test source basis
  - path: dddjango/skills/implementation-test/SKILL.md
    basis: implementation-test runtime routing, reference loading, and reporting rules
  - path: dddjango/skills/implementation-test/references/pytest-fixtures.md
    basis: pytest structure, assertions, fixtures, conftest, parametrization, markers, commands
  - path: dddjango/skills/implementation-test/references/test-doubles.md
    basis: dummy, stub, spy, mock, fake, time mocking, HTTP mocking
  - path: dddjango/skills/implementation-test/references/factories-property-tests.md
    basis: factory_boy, Faker, Hypothesis, property-based tests, BDD
  - path: dddjango/skills/implementation-test/references/coverage-mutation.md
    basis: test pyramid, testcontainers, coverage, mutation, flaky and quality signals
  - path: dddjango/skills/implementation-test/references/django-api-concurrency.md
    basis: Django Ninja TestClient, pytest-django DB selection, idempotency, transaction, lock, concurrency tests
target_behavior:
  required:
    - Routes as direct implementation-test response guidance rather than DDD, DB, API, TDD methodology, or workflow/subagent planning.
    - Chooses test levels and file placement for pytest tests, including when shared fixture definitions belong in root or nested conftest files.
    - Uses parametrization for meaningful coupon boundary examples and names behavior-focused assertion checks, including pytest.raises or pytest.approx where relevant.
    - Selects test double roles, preferring fake objects for useful in-memory behavior and mock or spy checks only for external HTTP/payment/clock adapter collaboration.
    - Explains factory_boy factory and Faker use for noisy Django data and Hypothesis/property-based tests for invariant checks without hiding simple literal setup.
    - Covers time mocking and HTTP mocking at adapter boundaries without real network calls.
    - Explains when testcontainers are justified for PostgreSQL lock, isolation, index, or constraint fidelity and how to isolate expensive containers.
    - Treats coverage and mutation as inspection signals, not proof of complete behavior coverage.
    - States whether BDD/pytest-bdd is useful only when stakeholder readable scenarios add value.
    - Gives flaky concurrency prevention criteria such as barrier coordination, lock timeout settings, backend assumptions, cleanup, and no arbitrary sleeps.
    - Uses Django Ninja TestClient for public API contract fields and idempotency replay/conflict tests.
    - Includes idempotency and concurrency evidence expectations such as one order, one side effect, one idempotency record, conflict on changed payload, and transaction-capable DB tests when needed.
    - Reports verification honestly and does not claim commands, tests, or subagent review were run.
  forbidden:
    - Replacing the test implementation answer with broad DDD modeling, REST contract design, DB schema design, or subagent workflow ceremony.
    - Requiring repository/UoW/outbox or production code changes as if they were part of the testing-only prompt.
    - Claiming pytest, coverage, mutation, testcontainers, or subagent review results without run artifacts or explicit evidence.
scoring_checks:
  - pass if the answer maps each requested testing concern to a source-backed test technique and keeps production/API/DB decisions as already-decided inputs.
  - fail if it only gives a generic test pyramid or only says "write unit and integration tests" without fixture, double, factory/property, and concurrency criteria.
  - fail if it treats coverage or mutation percentage as sufficient proof by itself.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, coverage, mutation, testcontainers, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - generic testing checklist without source-backed implementation-test detail
  - mixed-skill architecture answer instead of direct test implementation guidance
  - false verification or subagent claim
  - private oracle leakage
leakage_checks:
  - public response must not mention answer path, private scoring text, coverage_tags, reference_basis, or prior run notes.
evidence_required:
  - public prompt packet
  - baseline and with-dddjango response
  - baseline isolation artifact
  - with-dddjango prompt-input artifact
  - command, exit code, event stream, and stderr
  - answer-oracle evaluation notes
  - machine-readable answer-oracle evaluation artifact
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
