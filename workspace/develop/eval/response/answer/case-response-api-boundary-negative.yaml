id: case-response-api-boundary-negative
case_id: case-response-api-boundary-negative
bucket: response
kind: response
public_case: workspace/develop/eval/response/cases/plugin/public/case-response-api-boundary-negative.md
intent: architecture-api 제외 조건에서 REST 계약 skill을 과적용하지 않고 boundary만 판단하는지 검증한다.
reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: response bucket의 negative case와 over-application 방지 목적
  - path: workspace/reference/architecture-api/reference/final.md
    basis: REST 범위와 GraphQL, gRPC, SOAP, WebSocket, HATEOAS, API Gateway 제외 기준
  - path: dddjango/skills/architecture-api/SKILL.md
    basis: architecture-api routing exclusions and REST boundary rule
  - path: dddjango/skills/architecture-api/references/rest-contracts.md
    basis: REST resource/method/status/header contract로 다룰 수 있는 제한된 경계
target_behavior:
  required:
    - 주 요청의 중심이 WebSocket, GraphQL subscription/query, gRPC, SOAP, API Gateway routing, HATEOAS 상세 설계라서 `architecture-api`의 직접 소유 범위가 아니라고 판단한다.
    - REST가 필요한 경우에만 배송 현재 상태 조회나 이벤트 이력 조회 같은 보조 resource boundary를 짧게 제안하고, full REST endpoint matrix로 과확장하지 않는다.
    - REST boundary를 제안할 때는 제한된 resource/URL과 method/status를 중심으로 두고, auth, error, cache, rate limit 같은 API-visible 계약은 직접 관련된 항목만 간결히 언급한다.
    - GraphQL schema, WebSocket protocol, gRPC/SOAP contract, API Gateway routing policy, HATEOAS link relation 상세 설계는 별도 전문 설계나 사용자 확인으로 넘긴다.
    - 실제 코드, Django Ninja adapter, DB schema, pytest 구현을 작성하지 않는다.
    - 실행하지 않은 파일 검사, 테스트, subagent 실행을 주장하지 않는다.
  forbidden:
    - WebSocket/GraphQL 요구를 무시하고 REST endpoint 전체 설계로 대체한다.
    - HATEOAS나 API Gateway 상세 정책을 architecture-api 직접 책임으로 설계한다.
    - REST boundary 없이 단순히 "불가능"이라고만 답하고 사용자가 결정해야 할 경계를 남기지 않는다.
    - Django 구현이나 gateway 설정 코드를 작성한다.
scoring_checks:
  - pass if the answer resists over-applying REST while giving a useful REST boundary where appropriate.
  - pass if non-REST design areas are explicitly separated from architecture-api ownership.
  - partial if it says GraphQL/WebSocket are out of scope but gives no REST boundary decision.
  - fail if it converts the whole request into REST endpoint design or claims implementation work.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - REST over-application
  - non-REST ownership confusion
  - false verification claim
  - implementation-first answer
leakage_checks:
  - public response must not mention answer path, private scoring text, or prior run notes.
  - public response must not reveal evaluator-only field names from this YAML.
evidence_required:
  - baseline and with-dddjango response
  - baseline isolation artifact
  - answer-oracle evaluation notes
  - with-dddjango prompt-input artifact
control_case: negative
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: true
coverage_tags:
  - simple-negative
  - negative-architecture-api-boundary
  - api-contract
  - architecture-api
  - routing-boundary
  - grpc-soap-boundary
  - validation-honesty
