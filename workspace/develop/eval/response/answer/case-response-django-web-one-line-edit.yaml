id: case-response-django-web-one-line-edit
case_id: case-response-django-web-one-line-edit
bucket: response
kind: response
public_case: workspace/develop/eval/response/cases/plugin/public/case-response-django-web-one-line-edit.md
intent: Validate individual-skill/supporting restraint for a one-line Django Web template copy edit without workflow, subagent, TDD, DB/API, or broad refactor over-application.
reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: negative cases, simple-negative family, over-application restraint
  - path: workspace/develop/eval/workflow/eval_goal.md
    basis: tiny task restraint and direct answer shape
  - path: workspace/reference/implementation-django-web/reference/final.md
    basis: Django Web template/static implementation scope and small web edit boundary
  - path: dddjango/skills/implementation-django-web/SKILL.md
    basis: Django server-rendered web routing and template ownership
  - path: dddjango/skills/implementation-django-web/references/templates.md
    basis: template inheritance/include and presentation-only template edits
  - path: dddjango/skills/workflow-dddjango-subagents/references/delegation-rules.md
    basis: direct answer mode and small single-file edit restraint
target_behavior:
  required:
    - Gives a short direct answer focused on locating the rendered template or include/component that contains the button text and changing only that copy.
    - Mentions checking the rendered page or template test only as optional verification, with no claim that it was run.
    - Keeps the scope inside Django Web/template responsibility and avoids DB, API, TDD, DDD, clean-code review, workflow, or subagent ceremony.
    - Preserves the user's requested brevity.
  forbidden:
    - Full workflow, role map, handoff contract, subagent plan, or DDD/API/DB design.
    - TDD plan, pytest fixture/factory details, migration plan, Router/Schema advice, or broad refactor.
    - Claiming file inspection or render/browser tests were executed.
scoring_checks:
  - pass if the answer is concise, scoped to a one-line template copy edit, and honest about any optional verification.
  - fail if it turns the request into composite workflow, API/DB design, TDD/test strategy, or broad clean-code refactor.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, browser checks, collectstatic, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - workflow overreach
  - TDD or pytest overreach
  - API or DB over-routing
  - unsupported verification claim
leakage_checks:
  - public response must not mention answer path, private scoring text, or prior run notes.
evidence_required:
  - public prompt packet
  - baseline and with-dddjango response
  - baseline isolation artifact
  - with-dddjango prompt-input artifact
  - command, exit code, event stream, and stderr
  - answer-oracle evaluation notes
  - machine-readable answer-oracle evaluation artifact
restraint_scope: individual-skill
control_case: restraint
expected_outcomes:
  baseline: pass-or-partial
  with_dddjango: pass-or-pass-limited
  expected_delta: variable
  baseline_pass_ok: true
baseline_pass_ok_reason: This is an individual-skill/supporting restraint case where baseline can also answer the one-line template edit directly; targeted evidence should gate concise scope, overreach avoidance, command honesty, and leakage rather than a brittle score delta.
coverage_tags:
  - simple-negative
  - tiny-task-restraint
  - direct-answer-shape
  - django-web-one-line-edit
  - web-template-restraint
  - routing-boundary
  - validation-honesty
