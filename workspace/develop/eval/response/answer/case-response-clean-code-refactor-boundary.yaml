id: case-response-clean-code-refactor-boundary
case_id: case-response-clean-code-refactor-boundary
bucket: response
kind: response
public_case: workspace/develop/eval/response/cases/plugin/public/case-response-clean-code-refactor-boundary.md
intent: Validate implementation-cleancode review/refactor judgment across function shape, boundaries, errors, duplication, and overreach restraint.
reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: TDD/Test/Clean Code response scenarios and negative overreach controls
  - path: workspace/reference/implementation-cleancode/reference/final.md
    basis: clean-code source reference for naming, function shape, encapsulation, abstraction, SOLID, DRY, errors, and legacy refactoring
  - path: dddjango/skills/implementation-cleancode/SKILL.md
    basis: runtime routing, reference loading, review output, and overreach restraint
  - path: dddjango/skills/implementation-cleancode/references/responsibility.md
    basis: responsibility separation and Django/dddjango boundary smells
  - path: dddjango/skills/implementation-cleancode/references/naming-functions.md
    basis: naming, function shape, side effects, command/query separation
  - path: dddjango/skills/implementation-cleancode/references/encapsulation-abstraction.md
    basis: encapsulation, abstraction, SOLID, DRY, error handling
  - path: dddjango/skills/implementation-cleancode/references/legacy-review.md
    basis: legacy characterization tests and behavior-preserving refactoring
target_behavior:
  required:
    - Leads with findings ordered by severity before summary or refactor plan.
    - Identifies mixed responsibilities in process, including validation, discount policy, persistence, status mutation, notification, and response shaping.
    - Calls out weak naming and function shape such as generic names, flag arguments, hidden side effects, command/query mixing, and broad dict traversal.
    - Applies encapsulation and abstraction judgment by proposing stable intention-revealing methods or small use-case/domain helpers without shallow pass-through wrappers.
    - Applies SOLID as judgment, especially SRP by reason to change and DIP only for genuinely volatile details.
    - Treats duplication as duplicated business knowledge, not merely text similarity, and avoids abstracting coincidentally similar mechanics.
    - Handles errors at a useful abstraction level with explicit domain or boundary failures instead of generic exceptions.
    - Treats Schema/Router business logic as a boundary smell and moves DB reads/state transitions out of Schema validation.
    - Recommends characterization or regression tests before risky legacy reshaping.
    - States that repository/UoW/hexagonal rewrite is not justified unless a real boundary or replaceability need appears.
  forbidden:
    - Generic clean-code slogans without mapping to concrete responsibilities.
    - Recommending a broad architecture rewrite as the default fix.
    - Leaving discount and state transition rules in Schema/Router code.
    - Claiming tests, file inspection, command execution, or subagent review without evidence.
scoring_checks:
  - pass if the response produces concrete severity-first findings and a minimal behavior-preserving refactor plan grounded in the clean-code references.
  - fail if the response only renames variables or extracts methods without addressing responsibility, side effects, duplication knowledge, error handling, and Schema/Router boundary.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
  - answer must not require repository/UoW/hexagonal architecture unless the response first justifies the boundary need from the public prompt.
failure_modes:
  - no findings-first review stance
  - broad architecture overreach
  - function-shape-only answer that misses responsibility split
  - duplicated business rule not identified
  - generic exception accepted as sufficient
  - schema or router retains business decision
leakage_checks:
  - no answer YAML details in response.
  - no private evaluation labels or prior run findings in public/runtime output.
evidence_required:
  - response transcript
  - answer-oracle evaluation notes
  - command/subagent/test claim support or explicit not-run status
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
