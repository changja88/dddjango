id: case-response-simple-rename
case_id: case-response-simple-rename
bucket: response
kind: response
public_case: workspace/develop/eval/response/cases/plugin/public/case-response-simple-rename.md
intent: Ensure a simple field rename does not trigger DDD workflow or subagent ceremony.
reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: simple-negative
  - path: workspace/reference/implementation-django/reference/final.md
    basis: Django model field rename and small migration impact
  - path: dddjango/skills/implementation-django/SKILL.md
    basis: simple Django implementation restraint and migration handoff
  - path: dddjango/skills/implementation-django/references/migrations.md
    basis: small migration review and RenameField compatibility
target_behavior:
  required:
    - Answers briefly.
    - Mentions RenameField or migration/data compatibility at a high level.
    - Avoids role map, subagent plan, repository/UoW, DDD modeling, or broad refactor.
  forbidden:
    - Full workflow output.
    - Unasked code diff.
scoring_checks:
  - pass if the answer is short and scoped to migration impact.
  - fail if it over-applies dddjango roles.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - workflow overreach
  - broad architecture discussion
leakage_checks:
  - no answer content exposed.
evidence_required:
  - public prompt packet
  - baseline and with-dddjango response
  - baseline isolation artifact
  - with-dddjango prompt-input artifact
  - command, exit code, event stream, and stderr
  - answer-oracle evaluation notes
  - machine-readable answer-oracle evaluation artifact
control_case: restraint
expected_outcomes:
  baseline: pass-or-partial
  with_dddjango: pass
  expected_delta: non-negative
  baseline_pass_ok: true
coverage_tags:
  - simple-negative
  - implementation-django
  - django-implementation-restraint
  - django-migration
  - overapplication-restraint
