target_behavior:
  required:
    - TemplateView는 read-only context 준비, Generic CBV는 ListView/DetailView/FormView/CreateView/UpdateView 보일러플레이트, FBV는 custom method flow가 더 명시적인 경우로 선택 기준을 나눈다.
    - Template은 presentation-only로 두고 base template, block, include/component 분리는 반복 의미와 함께 바뀌는 UI fragment 기준으로 설명한다.
    - static CSS/JS는 hardcoded URL 대신 `{% load static %}`와 `{% static %}` 경로로 rendered template에 연결하고, 변경 asset이 rendered page에서 참조되는지 확인해야 한다.
    - `None`, blank string, missing optional value는 view/context builder/view-model helper에서 display-ready fallback으로 준비하고 template은 prepared display value만 렌더링한다고 설명한다.
    - web form은 GET, valid POST, invalid POST, POST/Redirect/GET, 사용자 회복 가능한 error rendering, `ModelForm.Meta.fields` 명시를 다룬다.
    - HTMX fragment는 web adapter로 취급하고 non-HTMX path와 같은 auth, permission, CSRF 검증 및 progressive enhancement 필요 여부를 확인한다.
    - Protected page의 auth/permission은 render 전에 view-level decorator/mixin으로 확인하고 template은 authorization decision을 소유하지 않는다고 분리한다.
    - render acceptance는 template/context render test, optional empty path, static reference existence, form/HTMX/security check, 미실행 browser/collectstatic/check --deploy 보고를 실제 실행 증거와 분리한다.
    - REST API 계약, Django Ninja Router/Schema, ORM/migration/transaction, pytest fixture/browser harness 상세 구현은 owning skill로 handoff한다.
  forbidden:
    - Template에서 domain state transition, permission policy, raw fallback, hidden DB query 결정을 하게 하는 답변.
    - Django Web 화면 요청을 REST API, Django Ninja endpoint, ORM transaction 설계, full workflow/subagent 계획으로 바꾸는 답변.
    - render, browser, collectstatic, security check를 실행하지 않았는데 실행한 것처럼 주장하는 답변.
scoring_checks:
  - pass if the answer covers TemplateView/Generic CBV/FBV, template/base/include, static, display fallback, forms, HTMX/CSRF, auth/permission, render acceptance, and handoff boundaries as Django Web concerns.
  - fail if web form guidance omits any of GET, valid POST, invalid POST, user-recoverable error rendering, or explicit `ModelForm.Meta.fields`.
  - fail if the answer gives generic frontend advice without Django server-rendered boundaries.
  - fail if the answer treats Router/Schema, ORM transaction, or pytest fixture mechanics as the main implementation owner.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, browser checks, collectstatic, check --deploy, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
