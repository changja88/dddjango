id: case-response-python-tiny-type-hint
case_id: case-response-python-tiny-type-hint
bucket: response
kind: response
public_case: workspace/develop/eval/response/cases/plugin/public/case-response-python-tiny-type-hint.md
intent: implementation-python 제외 조건과 tiny direct-answer restraint를 검증한다.
reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: simple negative와 overapplication restraint
  - path: workspace/reference/implementation-python/reference/final.md
    basis: Optional과 X | None 기준
  - path: dddjango/skills/implementation-python/SKILL.md
    basis: tiny syntax/direct answer exclusion
  - path: dddjango/skills/implementation-python/references/typing.md
    basis: X | None and Python version gate
target_behavior:
  required:
    - Gives a brief direct answer that Python 3.11 can use str | None instead of Optional[str].
    - Mentions Optional[str] remains equivalent or acceptable when compatibility/style requires it.
    - Avoids design review, DDD, DB, API, Django, workflow, subagent, or broad type-system lecture.
  forbidden:
    - Starting a workflow, role map, subagent plan, or multi-skill routing report.
    - Expanding into unrelated typing topics such as Protocol, pydantic, async, mypy rollout, or codebase inspection.
    - Claiming command execution, file inspection, or tests.
scoring_checks:
  - pass if the answer is short, direct, version-aware, and avoids ceremony.
  - fail if the answer over-applies the skill or invents verification.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - workflow over-application
  - unnecessary architecture routing
  - false verification claim
leakage_checks:
  - public response must not mention answer path, private scoring text, or prior run notes.
evidence_required:
  - public prompt packet
  - baseline and with-dddjango response
  - baseline isolation artifact
  - with-dddjango prompt-input artifact
  - command, exit code, event stream, and stderr
  - answer-oracle evaluation notes
  - machine-readable answer-oracle evaluation artifact
restraint_scope: individual-skill
control_case: negative
expected_outcomes:
  baseline: pass
  with_dddjango: pass
  expected_delta: neutral
  baseline_pass_ok: true
coverage_tags:
  - simple-negative
  - implementation-python
  - python-tiny-restraint
  - none-union
  - python-version-gate
  - overapplication-restraint
  - routing-boundary
