id: case-response-fat-view-review
case_id: case-response-fat-view-review
bucket: response
kind: response
public_case: workspace/develop/eval/response/cases/plugin/public/case-response-fat-view-review.md
intent: Check severity-first review for fat model and view/router logic boundaries.
reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: TDD/Test/Clean Code and review scenarios
  - path: workspace/reference/implementation-cleancode/reference/final.md
    basis: Fat Model/View/Router/Schema clean-code source reference
  - path: dddjango/skills/implementation-cleancode/SKILL.md
    basis: implementation-cleancode review output and Django boundary smells
  - path: dddjango/skills/implementation-cleancode/references/responsibility.md
    basis: responsibility separation and Fat Model/View/Router/Schema boundary smells
target_behavior:
  required:
    - Leads with findings ordered by severity.
    - Keeps domain invariants near the model/domain behavior boundary and moves orchestration to service/usecase.
    - Treats Router as adapter boundary for validation/auth/call/response conversion, not business rule owner.
    - Names the responsibility boundary for model/domain behavior, service/usecase orchestration, and Router adapter code.
    - Includes behavior-preserving tests or review evidence gaps.
  forbidden:
    - Splitting only because the model is large.
    - Hiding findings behind a long summary.
scoring_checks:
  - pass if findings are concrete, severity ordered, and map each responsibility to a boundary.
  - fail if it gives generic refactoring slogans.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - no findings-first review stance
  - router retains business decision
  - no test/regression mention
leakage_checks:
  - no answer YAML details in response.
evidence_required:
  - public prompt packet
  - baseline and with-dddjango response
  - baseline isolation artifact
  - with-dddjango prompt-input artifact
  - command, exit code, event stream, and stderr
  - answer-oracle evaluation notes
  - machine-readable answer-oracle evaluation artifact
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - specialist-positive
  - implementation-cleancode
  - clean-code
  - maintainability
  - review-refactor
  - responsibility-separation
  - view-logic-review
  - fat-model-review
  - view-router-boundary
