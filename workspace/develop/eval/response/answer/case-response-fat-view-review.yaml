id: case-response-fat-view-review
case_id: case-response-fat-view-review
bucket: response
kind: response
public_case: workspace/develop/eval/response/cases/plugin/public/case-response-fat-view-review.md
intent: Check severity-first review for fat model and view/router logic boundaries.
reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: TDD/Test/Clean Code and review scenarios
  - path: workspace/docs/validation-plan.md
    basis: Fat Model review and View Logic review
  - path: workspace/docs/skill-contracts.md
    basis: implementation-cleancode and implementation-django-ninja boundaries
target_behavior:
  required:
    - Leads with findings ordered by severity.
    - Keeps domain invariants near the model/domain behavior and moves orchestration to service/usecase.
    - Treats Router as adapter for validation/auth/call/response conversion, not business rule owner.
    - Includes behavior-preserving tests or review evidence gaps.
  forbidden:
    - Splitting only because the model is large.
    - Hiding findings behind a long summary.
scoring_checks:
  - pass if findings are concrete, severity ordered, and map each responsibility to a boundary.
  - fail if it gives generic refactoring slogans.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - no findings-first review stance
  - router retains business decision
  - no test/regression mention
leakage_checks:
  - no answer YAML details in response.
evidence_required:
  - response transcript
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - specialist-positive
  - clean-code
  - view-logic-review
  - fat-model-review
