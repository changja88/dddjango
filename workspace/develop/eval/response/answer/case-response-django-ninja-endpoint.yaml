target_behavior:
  required:
    - Treats Django Ninja Router as a thin endpoint adapter that binds request schema, auth/permission, service/usecase or selector calls, response schema mapping, and domain/application error translation.
    - Separates request Schema and response Schema; allows ModelSchema only with explicit public fields and rejects accidental exposure of internal, management, or permission-sensitive fields.
    - Connects authentication and authorization to API, Router, or operation level and distinguishes `401` from `403` without moving reusable object/action policy into the Router.
    - Uses explicit public filtering and sorting parameters, such as `FilterSchema` or typed query binding, and refuses user-controlled ORM field names or hidden DB structure as public API.
    - Applies the already-decided pagination strategy through Django Ninja pagination hooks or a custom response shape, with page size bounds, stable ordering, and next-page metadata.
    - Maps validation, application, and domain errors to RFC 9457 Problem Details unless legacy compatibility explicitly requires another error shape.
    - States OpenAPI impacts for request/response schema, status responses, Problem Details, auth/security, pagination metadata, tags, and DRF compatibility differences.
    - Handles DRF-to-Ninja migration compatibility explicitly when legacy DRF behavior is the source input, including what must migrate to Router operations, Schema/ModelSchema mapping, and TestClient checks.
    - Gives Django Ninja TestClient acceptance checks for success, invalid payload, `401`/`403`, Problem Details, filtering/sorting, pagination, and DRF-to-Ninja compatibility without claiming tests were run.
    - Treats REST contract decisions, DB transaction/idempotency storage, domain invariants, and detailed pytest fixture mechanics as already decided or as handoff to the owning skill when missing.
  forbidden:
    - Recommending DRF Serializer/ViewSet/APIView/DefaultRouter as the greenfield implementation target.
    - Putting business rules, state transitions, transaction ownership, complex ORM query construction, or external SDK orchestration in Router, Schema, FilterSchema, or schema resolver code.
    - Exposing all model fields through ModelSchema or public sort/filter parameters.
    - Claiming TestClient, OpenAPI generation, schema diff, file inspection, or subagent review was executed without run evidence.
scoring_checks:
  - pass if the answer covers Router, Schema/ModelSchema, endpoint adapter, auth/permission, filtering/sorting, pagination, Problem Details, OpenAPI, TestClient, and DRF-to-Ninja compatibility as Django Ninja adapter concerns.
  - pass if the answer explicitly hands off undecided REST contract, DB storage/transaction, domain invariant, and detailed pytest mechanics instead of solving them inside the Ninja adapter.
  - fail if the answer keeps DRF as the new standard, places durable business decisions in Router/Schema, or omits two or more of auth, filtering, pagination, Problem Details, OpenAPI, and TestClient checks.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, OpenAPI generation, schema diff, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - DRF greenfield recommendation
  - fat Router or Schema owns business rule or transaction
  - ModelSchema exposes accidental fields
  - filtering/sorting accepts raw ORM field names
  - pagination metadata or page size bound omitted
  - generic JSON error envelope replaces Problem Details without legacy reason
  - OpenAPI impact omitted
  - false TestClient or schema-generation claim
leakage_checks:
  - public response must not mention answer path, private scoring text, coverage tag list, or prior run notes.
evidence_required:
  - public prompt packet
  - baseline and with-dddjango response
  - baseline isolation artifact
  - with-dddjango prompt-input artifact
  - command, exit code, event stream, and stderr
  - answer-oracle evaluation notes
  - machine-readable answer-oracle evaluation artifact
