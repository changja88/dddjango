id: case-response-drf-ninja
case_id: case-response-drf-ninja
bucket: response
kind: response
public_case: workspace/develop/eval/response/cases/plugin/public/case-response-drf-ninja.md
intent: Check mixed-boundary DRF migration advice while preserving Django Ninja as the new implementation target.
reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: mixed-boundary and Django/Ninja routing
  - path: workspace/reference/implementation-django-ninja/reference/final.md
    basis: DRF-to-Ninja migration, Router/Schema adapter boundary, compatibility, OpenAPI, TestClient criteria
  - path: dddjango/skills/implementation-django-ninja/SKILL.md
    basis: DRF Serializer/ViewSet conversion to Django Ninja unless legacy maintenance is requested
  - path: dddjango/skills/implementation-django-ninja/references/router-schema.md
    basis: DRF ViewSet/APIView to Router operation conversion and request/response schema mapping
  - path: dddjango/skills/implementation-django-ninja/references/auth-pagination-filtering.md
    basis: DRF auth, filtering, sorting, and pagination compatibility mapping
  - path: dddjango/skills/implementation-django-ninja/references/problem-details-openapi.md
    basis: Problem Details, compatibility, and OpenAPI difference checks
  - path: dddjango/skills/implementation-django-ninja/references/testclient.md
    basis: DRF-to-Ninja compatibility and TestClient contract checks
  - path: workspace/reference/source-reference-audit/reference/final.md
    basis: DRF guardrail
  - path: dddjango/skills/source-reference-audit/SKILL.md
    basis: architecture-api and implementation-django-ninja boundaries
target_behavior:
  required:
    - Treats DRF as legacy input or migration source, not a greenfield standard.
    - Separates API contract decisions from Django Ninja implementation details.
    - Converts DRF ViewSet/APIView routing into explicit Django Ninja Router operations and separates DRF Serializer responsibilities into request Schema, response Schema, ModelSchema field decisions, and service-layer validation where needed.
    - Compares DRF filtering and sorting plus pagination behavior with the Django Ninja equivalent so public query parameters, page size limits, response metadata, and ordering compatibility are preserved or explicitly changed.
    - Calls out status code, Problem Details, compatibility, authentication, permission, OpenAPI diff, and Django Ninja TestClient/golden contract checks.
    - Keeps domain rules, state transitions, transactions, and complex ORM queries outside Router and Schema code.
    - Reports migration risks and verification expectations without claiming file inspection, OpenAPI generation, TestClient, or subagent execution.
  forbidden:
    - Rewriting domain rules into Router.
    - Ignoring existing-client compatibility.
    - Keeping DRF Serializer/ViewSet/APIView/DefaultRouter as the preferred new API standard.
    - Claiming DRF-to-Ninja compatibility checks were executed without run evidence.
scoring_checks:
  - pass if the answer gives a migration plan with contract freeze, schema mapping, compatibility checks, and rollback risk.
  - fail if it keeps DRF as preferred new API framework.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - DRF greenfield recommendation
  - compatibility omitted
  - OpenAPI impact omitted
  - Router or Schema owns domain rule
  - false TestClient or schema diff claim
leakage_checks:
  - no evaluator-only route names or answer file content in output.
evidence_required:
  - public prompt packet
  - baseline and with-dddjango response
  - baseline isolation artifact
  - with-dddjango prompt-input artifact
  - command, exit code, event stream, and stderr
  - answer-oracle evaluation notes
  - machine-readable answer-oracle evaluation artifact
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
