id: case-response-drf-ninja
case_id: case-response-drf-ninja
bucket: response
kind: response
public_case: workspace/develop/eval/response/cases/plugin/public/case-response-drf-ninja.md
intent: Check mixed-boundary DRF migration advice while preserving Django Ninja as the new implementation target.
reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: mixed-boundary and Django/Ninja routing
  - path: workspace/docs/reference-index.md
    basis: DRF guardrail
  - path: workspace/docs/skill-contracts.md
    basis: architecture-api and implementation-django-ninja boundaries
  - path: workspace/docs/validation-plan.md
    basis: DRF to Django Ninja transition
target_behavior:
  required:
    - Treats DRF as legacy input or migration source, not a greenfield standard.
    - Separates API contract decisions from Django Ninja implementation details.
    - Calls out status code, Problem Details, compatibility, auth, OpenAPI diff, and TestClient/golden contract checks.
  forbidden:
    - Rewriting domain rules into Router.
    - Ignoring existing-client compatibility.
scoring_checks:
  - pass if the answer gives a migration plan with contract freeze, schema mapping, compatibility checks, and rollback risk.
  - fail if it keeps DRF as preferred new API framework.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - DRF greenfield recommendation
  - compatibility omitted
  - OpenAPI impact omitted
leakage_checks:
  - no evaluator-only route names or answer file content in output.
evidence_required:
  - response transcript
  - prompt-input isolation review
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - mixed-boundary
  - django-ninja
  - drf-guardrail
  - api-contract
