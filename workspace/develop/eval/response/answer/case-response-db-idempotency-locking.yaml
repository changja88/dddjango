id: case-response-db-idempotency-locking
case_id: case-response-db-idempotency-locking
bucket: response
kind: response
public_case: workspace/develop/eval/response/cases/plugin/public/case-response-db-idempotency-locking.md
intent: architecture-db 단독 risky-write transaction/isolation/locking, idempotency storage, duplicate prevention 판단을 검증한다.
reference_basis:
  - path: workspace/develop/eval/response/eval_goal.md
    basis: Risky DB/API와 specialist-positive coverage
  - path: workspace/reference/architecture-db/reference/final.md
    basis: 트랜잭션, 격리 수준, 락, 제약조건, 중복 방지, 멱등성 저장소
  - path: dddjango/skills/architecture-db/SKILL.md
    basis: risky write DB-owned decisions와 handoff boundary
  - path: dddjango/skills/architecture-db/references/transactions-locking.md
    basis: transaction boundary, locking strategy, idempotency storage, isolation/retry, side-effect timing
  - path: dddjango/skills/architecture-db/references/constraints-indexes.md
    basis: unique constraint, duplicate prevention, idempotency storage constraint
target_behavior:
  required:
    - DB가 소유하는 transaction boundary 또는 이미 정해진 transaction owner를 명확히 둔다.
    - `payment_id` 자연 유일성과 idempotency key race를 unique constraint 또는 동등한 DB 제약으로 막는다.
    - idempotency storage의 key scope, owner/location, unique constraint, request fingerprint/hash, stored result 또는 stable replay reference를 설명한다.
    - 같은 key와 다른 fingerprint는 충돌로 식별할 수 있도록 저장 구조와 판정 기준을 둔다.
    - locking strategy를 unique constraint, optimistic, pessimistic, advisory, serializable 중 상황에 맞게 고르고 deadlock/timeout/serialization failure retry 기준을 언급한다.
    - lowest sufficient isolation 원칙을 적용하고 필요한 경우 explicit lock/constraint를 결합한다.
    - retention/cleanup이 unique constraint 의미와 replay 가능성을 깨지 않도록 기준을 둔다.
    - 알림 발송 같은 외부 side effect는 DB transaction 내부에서 실행하지 않고 commit 이후 handoff해야 함을 DB risk 관점에서 말한다.
    - API `Idempotency-Key` replay/conflict contract, outbox/saga 패턴 선택, concrete Django implementation, concurrency test mechanics는 owning skill로 넘기거나 범위 밖으로 둔다.
  forbidden:
    - 중복 방지를 application validation 또는 사전 SELECT만으로 처리한다.
    - idempotency key만 저장하고 request fingerprint와 replay result/reference를 생략한다.
    - 모든 문제를 Serializable만으로 해결한다고 하고 retry 비용과 DB constraint를 설명하지 않는다.
    - 외부 알림 발송을 DB transaction 안에서 기본으로 실행한다.
    - API response schema, Django code, workflow role map을 답변의 중심으로 둔다.
scoring_checks:
  - pass if the answer gives a DB-owned risky write consistency block with idempotency storage, uniqueness, locking/isolation, retry, and side-effect timing boundaries.
  - fail if duplicate prevention depends only on application checks or if idempotency replay/conflict data is not persisted.
  - fail if API or Django implementation details replace DB architecture decisions.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, EXPLAIN runs, migrations, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - application-only duplicate prevention
  - fingerprint omitted
  - isolation choice without retry policy
  - side effect inside DB transaction by default
leakage_checks:
  - public response must not mention answer path, private scoring text, or prior run notes.
evidence_required:
  - public prompt packet
  - baseline and with-dddjango response
  - baseline isolation artifact
  - with-dddjango prompt-input artifact
  - command, exit code, event stream, and stderr
  - answer-oracle evaluation notes
  - machine-readable answer-oracle evaluation artifact
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
