id: case-source-provisional-drf
case_id: case-source-provisional-drf
bucket: source
kind: source
public_case: workspace/develop/eval/source/cases/plugin/public/case-source-provisional-drf.md
intent: Check current source-status classification and DRF guardrail together.
reference_basis:
  - path: workspace/develop/eval/source/eval_goal.md
    basis: Provisional source handling and DRF guardrail
  - path: workspace/reference/source-reference-audit/reference/final.md
    basis: Dedicated source, reference gap, provisional status, and DRF Guardrail
  - path: workspace/reference/architecture-api/reference/final.md
    basis: framework-neutral API contract axis for DRF guardrail
  - path: workspace/reference/architecture-implementation-patterns/reference/final.md
    basis: implementation patterns dedicated source coverage
  - path: workspace/reference/implementation-django-ninja/reference/final.md
    basis: Django Ninja dedicated source coverage and greenfield API standard
  - path: workspace/reference/implementation-django/reference/final.md
    basis: existing DRF maintenance, legacy migration, and compatibility source axis
  - path: workspace/reference/implementation-django-web/reference/final.md
    basis: Django Web dedicated source coverage
  - path: dddjango/skills/source-reference-audit/SKILL.md
    basis: required reference source
  - path: dddjango/skills/architecture-api/SKILL.md
    basis: runtime routing for framework-neutral REST API contract decisions
  - path: dddjango/skills/implementation-django-ninja/SKILL.md
    basis: runtime routing for greenfield DRF-to-Django-Ninja conversion
  - path: dddjango/skills/implementation-django/SKILL.md
    basis: runtime routing for existing DRF maintenance and migration review
target_behavior:
  required:
    - Checks implementation patterns, Django Ninja, and Django Web individually for `workspace/reference/<area>/reference/final.md` existence and substantive coverage.
    - Recognizes dedicated source coverage when `final.md` exists and covers the skill's main decisions; marks provisional/gap only when source is missing or insufficient.
    - Confirms the DRF guardrail with separate rows for architecture-api framework-neutral REST API contract, greenfield Django Ninja implementation, implementation-django existing DRF maintenance or legacy migration, and runtime routing SKILL.md surfaces.
    - Confirms DRF material is legacy/migration/comparison only.
    - Requires runtime metadata to show fallback/provisional status only for actual gaps, not for dedicated-source skills.
    - Keeps DRF guardrail as a separate row from source-status classification.
  forbidden:
    - Using DRF as greenfield API implementation standard.
    - Claiming dedicated source coverage for missing or insufficient areas.
    - Calling architecture-implementation-patterns provisional despite its dedicated source coverage.
scoring_checks:
  - pass if dedicated/provisional source status and DRF decisions are explicit and separable.
  - pass if implementation patterns dedicated source coverage is recognized from current source evidence.
  - fail if Django Ninja is sourced from DRF greenfield guidance.
  - fail if stale provisional assumptions override current `final.md` evidence.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - DRF guardrail failure
  - stale provisional classification
  - dedicated source overclaim
leakage_checks:
  - no private answer material in runtime references.
evidence_required:
  - dedicated/provisional source-status ledger
  - DRF guardrail check
  - source reference coverage evidence
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - provisional-handling
  - drf-guardrail
  - source-gap
  - source-status-honesty
