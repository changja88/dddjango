id: case-source-provenance-crosswalk
case_id: case-source-provenance-crosswalk
bucket: source
kind: source
public_case: workspace/develop/eval/source/cases/plugin/public/case-source-provenance-crosswalk.md
intent: Require source-to-runtime provenance mapping for every first-class dimension.
reference_basis:
  - path: workspace/develop/eval/source/eval_goal.md
    basis: Reference provenance and crosswalk
  - path: workspace/reference/source-reference-audit/reference/final.md
    basis: required reference source
  - path: workspace/reference/*/reference/final.md
    basis: per-skill source decision basis for runtime bundled reference provenance
  - path: dddjango/skills/workflow-dddjango-subagents/references/role-map.md
    basis: required reference source
  - path: dddjango/skills/*/references/*.md
    basis: required reference source
target_behavior:
  required:
    - Produces a per-skill crosswalk from workspace/reference or docs source to runtime bundled references.
    - Marks provisional skills and fallback source basis separately.
    - Includes DDD, patterns, DB, API, Django, Ninja, Web, Python, Clean Code, TDD, Test, Workflow.
  forbidden:
    - Treating runtime references as source of truth without provenance.
scoring_checks:
  - pass if all first-class dimensions have source and runtime columns.
  - fail if provisional dimensions are omitted.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - missing provenance
  - runtime-only source claim
leakage_checks:
  - answer oracle not included in crosswalk output.
evidence_required:
  - source-to-runtime crosswalk
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - source-provenance
  - crosswalk
  - runtime-reference-trace
