id: case-source-routing-exclusion
case_id: case-source-routing-exclusion
bucket: source
kind: source
public_case: workspace/develop/eval/source/cases/plugin/public/case-source-routing-exclusion.md
intent: Verify source-reference-audit positive routing and exclusion conditions.
reference_basis:
  - path: workspace/develop/eval/source/eval_goal.md
    basis: Source-audit routing restraint and negative case coverage
  - path: workspace/reference/source-reference-audit/reference/final.md
    basis: Artifact roles, runtime/source boundaries, and source-audit scope decisions
  - path: dddjango/skills/source-reference-audit/SKILL.md
    basis: Positive routing, negative routing, and owning-skill handoff rules
  - path: dddjango/skills/source-reference-audit/references/source-governance.md
    basis: Runtime-local boundary and provenance summary
target_behavior:
  required:
    - Routes source provenance, bundled reference, agents metadata, runtime cache sync, and boundary audits to source-reference-audit.
    - Routes Django implementation, model, ORM, and API implementation work to the owning skill instead of source-reference-audit.
    - Routes test mechanics, pytest fixture, and assertion work to the owning skill instead of source-reference-audit.
    - Gives a brief routing decision and says to avoid provenance ledger, crosswalk, or source-gap ceremony for excluded implementation/test requests.
  forbidden:
    - Applying source-reference-audit to ordinary Django implementation or pytest mechanics just because validation wording appears.
    - Producing source governance ledger, crosswalk, or cache sync checklist for excluded requests.
    - Claiming subagent or validation execution without evidence.
scoring_checks:
  - pass if positive source-governance routing and implementation/test exclusions are both explicit.
  - fail if the answer forces all validation or Django requests into source-reference-audit.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - source-audit overtrigger
  - implementation/test exclusion missed
  - unnecessary provenance ceremony
leakage_checks:
  - no answer-only schema fields, private scoring text, or previous run conclusions in public output.
evidence_required:
  - positive routing decision
  - exclusion routing decision
  - ceremony restraint note
control_case: negative
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - source-audit-exclusion
  - routing-boundary
  - negative-cases
