id: case-source-docs-coherence
case_id: case-source-docs-coherence
bucket: source
kind: source
public_case: workspace/develop/eval/source/cases/plugin/public/case-source-docs-coherence.md
intent: Audit canonical docs coherence across product, skill, workflow, validation, and plugin structure decisions.
reference_basis:
  - path: workspace/develop/eval/source/eval_goal.md
    basis: Canonical docs coherence
  - path: workspace/docs/spec.md
    basis: required reference source
  - path: workspace/docs/reference-index.md
    basis: required reference source
  - path: workspace/docs/skill-contracts.md
    basis: required reference source
  - path: workspace/docs/workflow.md
    basis: required reference source
  - path: workspace/docs/validation-plan.md
    basis: required reference source
  - path: workspace/docs/plugin-structure.md
    basis: required reference source
  - path: workspace/docs/skill-authoring.md
    basis: required reference source
target_behavior:
  required:
    - Checks the docs as a connected decision set, not isolated files.
    - Confirms Django Ninja as greenfield API target and DRF as legacy/migration/comparison only.
    - Confirms workflow role map and validation plan agree on roles and completion gates.
  forbidden:
    - Declaring coherence from docs existence alone.
scoring_checks:
  - pass if concrete cross-doc decisions and mismatches are listed with source paths.
  - fail if answer is a generic summary.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - docs contradiction missed
  - validation-plan mismatch missed
leakage_checks:
  - private answer content not proposed for docs.
evidence_required:
  - source inventory
  - docs coherence notes
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - docs-coherence
  - canonical-decisions
