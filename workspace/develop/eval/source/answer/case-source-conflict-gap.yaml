id: case-source-conflict-gap
case_id: case-source-conflict-gap
bucket: source
kind: source
public_case: workspace/develop/eval/source/cases/plugin/public/case-source-conflict-gap.md
intent: Evaluate conflict/gap handling across reference final/internal/external/review materials.
reference_basis:
  - path: workspace/develop/eval/source/eval_goal.md
    basis: Conflict and gap handling
  - path: workspace/reference/*/reference/review.md
    basis: required reference source
  - path: workspace/reference/*/reference/final.md
    basis: required reference source
  - path: workspace/reference/source-reference-audit/reference/final.md
    basis: required reference source
target_behavior:
  required:
    - Consults final.md first, then review/internal/external when final is ambiguous or gap-related.
    - Separates resolved conflicts, open gaps, and provisional decisions.
    - Records allowed and forbidden claims for unresolved gaps.
  forbidden:
    - Flattening review conflicts into final guidance without decision.
scoring_checks:
  - pass if each conflict/gap has status and evidence.
  - fail if gaps are presented as completed source coverage.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - unresolved gap overclaimed
  - review conflict ignored
leakage_checks:
  - no private eval answer text in source docs.
evidence_required:
  - conflict/gap ledger
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - conflict-gap-decision
  - source-review
