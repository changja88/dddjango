id: case-runtime-missing-metadata
case_id: case-runtime-missing-metadata
bucket: runtime
kind: runtime
public_case: workspace/develop/eval/runtime/cases/plugin/public/case-runtime-missing-metadata.md
intent: Evaluate missing agents metadata impact in runtime exposure.
reference_basis:
  - path: workspace/develop/eval/runtime/eval_goal.md
    basis: missing skill metadata
  - path: dddjango/skills/source-reference-audit/SKILL.md
    basis: metadata/default prompt criteria
  - path: workspace/develop/eval
    basis: skill folder validation
target_behavior:
  required:
    - Checks that SKILL.md and agents/openai.yaml both exist and semantically align.
    - Explains how missing metadata may reduce prompt exposure or UI/default prompt routing.
    - Captures validation command output from generated/all validation or an equivalent metadata validator, not only file existence.
    - Compares semantic metadata alignment across skill description, UI metadata, and default prompt.
  forbidden:
    - Ignoring metadata because SKILL.md exists.
scoring_checks:
  - pass if missing metadata is treated as runtime quality failure with validation output and semantic alignment evidence.
  - fail if only SKILL.md is inspected.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - metadata missing
  - semantic mismatch ignored
leakage_checks:
  - private scoring data absent from replacement metadata.
evidence_required:
  - skill tree snapshot
  - validation command output
  - semantic metadata alignment notes
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - missing-skill-metadata
  - agents-metadata
