id: case-runtime-prompt-exposure
case_id: case-runtime-prompt-exposure
bucket: runtime
kind: runtime
public_case: workspace/develop/eval/runtime/cases/plugin/public/case-runtime-prompt-exposure.md
intent: Validate with-dddjango prompt-input exposure for relevant runtime metadata.
reference_basis:
  - path: workspace/develop/eval/runtime/eval_goal.md
    basis: Prompt-input exposure
  - path: dddjango/.codex-plugin/plugin.json
    basis: runtime synchronization
  - path: dddjango/skills/workflow-dddjango-subagents/references/role-map.md
    basis: role map
target_behavior:
  required:
    - Requires prompt-input or equivalent artifact for with-ddjango.
    - Checks exposed dddjango skill ids, descriptions, reference hints, and workflow role-map responsibilities.
    - Compares exposure against canonical dddjango/skills and dddjango/skills/workflow-dddjango-subagents/references/role-map.md.
  forbidden:
    - Treating a raw model answer as enough runtime evidence.
    - Exposing private answer material.
scoring_checks:
  - pass if with-ddjango metadata is current and scoped to relevant skills.
  - fail if prompt-input is missing or stale.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - missing prompt-input artifact
  - stale skill description
leakage_checks:
  - answer directory, prior runs, and private evaluator text absent from prompt-input.
evidence_required:
  - codex debug prompt-input output
  - runtime skill snapshot
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - prompt-input-exposure
  - skill-metadata
  - role-map-sync
