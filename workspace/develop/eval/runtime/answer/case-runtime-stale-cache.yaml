id: case-runtime-stale-cache
case_id: case-runtime-stale-cache
bucket: runtime
kind: runtime
public_case: workspace/develop/eval/runtime/cases/plugin/public/case-runtime-stale-cache.md
intent: Detect stale runtime cache and prevent cache-only completion.
reference_basis:
  - path: workspace/develop/eval/runtime/eval_goal.md
    basis: stale cache and cache/source consistency
  - path: workspace/docs/plugin-structure.md
    basis: Runtime synchronization criteria
target_behavior:
  required:
    - Compares installed/cache skill metadata or a captured cache metadata surface with canonical dddjango source.
    - Makes an evidence-backed freshness judgment; stale if cache/source differ, fresh if they match, and unknown/blocking if evidence is missing.
    - Requires matching workspace docs/source intent before completion.
    - Uses validate_skill_docs.py --phase runtime as smoke only, not sole completion gate.
  forbidden:
    - Declaring completion after editing cache alone.
    - Importing cache blindly into canonical source.
scoring_checks:
  - pass if cache freshness is judged from source/cache evidence and sync validation.
  - fail if stale or fresh is asserted without comparing cache metadata to canonical source.
  - fail if cache-only hotfix is accepted.
failure_modes:
  - cache-only fix
  - canonical source mismatch
  - unsupported freshness conclusion
leakage_checks:
  - no private eval packet copied into cache.
evidence_required:
  - cache snapshot or captured active cache metadata surface
  - canonical source comparison
  - runtime validation output
coverage_tags:
  - stale-cache
  - cache-source-consistency
