id: case-runtime-baseline-isolation
case_id: case-runtime-baseline-isolation
bucket: runtime
kind: runtime
public_case: workspace/develop/eval/runtime/cases/plugin/public/case-runtime-baseline-isolation.md
intent: Check baseline isolation from plugin metadata and evaluator materials.
reference_basis:
  - path: workspace/develop/eval/runtime/eval_goal.md
    basis: Baseline isolation
  - path: workspace/scripts/validate_eval_protocol.py
    basis: baseline artifact expectations
target_behavior:
  required:
    - Requires baseline isolation JSON with pass true and ignore-user-config/ignore-rules evidence.
    - Confirms sanitized workspace excludes plugin source, cache paths, and answer materials.
    - Treats baseline contamination as invalid comparison, not as with-dddjango improvement.
  forbidden:
    - Running baseline from original repo root with plugin visible.
    - Allowing baseline prompt-input artifact with dddjango metadata.
scoring_checks:
  - pass if baseline cannot see dddjango metadata or private evaluator paths.
  - fail if baseline output/operator prompt includes plugin metadata.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - baseline contamination
  - missing ignore flags
leakage_checks:
  - canonical plugin source path and answer path absent from baseline artifacts.
evidence_required:
  - baseline-isolation.json
  - baseline command artifact
control_case: honesty
expected_outcomes:
  baseline: pass-or-partial
  with_dddjango: pass
  expected_delta: non-negative
  baseline_pass_ok: true
coverage_tags:
  - baseline-isolation
  - contamination-scan
