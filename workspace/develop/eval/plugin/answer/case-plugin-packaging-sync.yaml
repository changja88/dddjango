id: case-plugin-packaging-sync
case_id: case-plugin-packaging-sync
bucket: plugin
kind: plugin
public_case: workspace/develop/eval/plugin/cases/plugin/public/case-plugin-packaging-sync.md
intent: Check packaging path, manifest, marketplace, and symlink coherence.
reference_basis:
  - path: workspace/develop/eval/plugin/eval_goal.md
    basis: Packaging
  - path: dddjango/.codex-plugin/plugin.json
    basis: root exceptions and plugin layout
  - path: .agents/plugins/marketplace.json
    basis: marketplace entry and plugin availability metadata
  - path: plugins/dddjango
    basis: symlink or equivalent plugin entry coherence
target_behavior:
  required:
    - Verifies plugin.json, marketplace entry, plugins/dddjango, and canonical dddjango source point to the same plugin identity.
    - Distinguishes required root exceptions from workspace development artifacts.
    - Reports path/version/name mismatches without editing files.
  forbidden:
    - Treating cache-only state as canonical source.
    - Moving plugin runtime-required root files into workspace.
scoring_checks:
  - pass if packaging evidence covers manifest, marketplace, symlink/equivalent entry, and canonical source.
  - fail if only plugin.json is checked.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - symlink mismatch missed
  - marketplace stale
leakage_checks:
  - no answer or prior run material in packaging metadata.
evidence_required:
  - plugin manifest
  - marketplace entry
  - symlink or equivalent entry check
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - packaging
  - marketplace-sync
  - source-of-truth
