id: case-plugin-agents-metadata
case_id: case-plugin-agents-metadata
bucket: plugin
kind: plugin
public_case: workspace/develop/eval/plugin/cases/plugin/public/case-plugin-agents-metadata.md
intent: Check UI metadata semantic match against runtime skills.
reference_basis:
  - path: workspace/develop/eval/plugin/eval_goal.md
    basis: Agents metadata
  - path: skill-creator-system-skill
    basis: agents/openai.yaml metadata
  - path: dddjango/skills/source-reference-audit/SKILL.md
    basis: metadata/default prompt criteria
target_behavior:
  required:
    - Compares display_name, short_description, and default_prompt with SKILL.md semantics.
    - Verifies default_prompt uses exact skill name.
    - Flags stale UI copy, overclaim, and cross-skill responsibility drift.
  forbidden:
    - Judging metadata by file existence only.
    - Adding optional branding fields without explicit source.
scoring_checks:
  - pass if field-level checks and semantic mismatch risks are reported.
  - fail if only YAML syntax is checked.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - stale default prompt missed
  - wrong skill name missed
leakage_checks:
  - answer criteria not copied into agents/openai.yaml.
evidence_required:
  - agents/openai.yaml review notes
  - SKILL.md semantic comparison
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - agents-metadata
  - field-level-checks
  - stale-ui-copy
