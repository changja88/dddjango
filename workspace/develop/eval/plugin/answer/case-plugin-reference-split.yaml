id: case-plugin-reference-split
case_id: case-plugin-reference-split
bucket: plugin
kind: plugin
public_case: workspace/develop/eval/plugin/cases/plugin/public/case-plugin-reference-split.md
intent: Evaluate progressive disclosure and runtime reference split quality.
reference_basis:
  - path: workspace/develop/eval/plugin/eval_goal.md
    basis: Progressive disclosure and runtime reference split
  - path: skill-creator-system-skill
    basis: progressive disclosure
  - path: workspace/docs/plugin-structure.md
    basis: reference file criteria
  - path: workspace/docs/reference-index.md
    basis: DRF guardrail
target_behavior:
  required:
    - Checks SKILL.md body concision and direct one-level references.
    - Confirms detailed source material is not copied wholesale into runtime instructions.
    - Maps each reference file to load conditions and negative conditions.
    - Flags DRF content that looks like greenfield standard.
  forbidden:
    - Creating README/install/changelog auxiliary docs as a fix.
scoring_checks:
  - pass if answer includes concrete split/routing findings.
  - fail if it only lists reference files.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - source-copy bloat
  - missing reference routing matrix
leakage_checks:
  - no eval answer content in bundled references.
evidence_required:
  - skill tree snapshot
  - reference link inventory
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - progressive-disclosure
  - runtime-reference-split
  - auxiliary-docs-ban
