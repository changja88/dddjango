id: case-plugin-provisional-overclaim
case_id: case-plugin-provisional-overclaim
bucket: plugin
kind: plugin
public_case: workspace/develop/eval/plugin/cases/plugin/public/case-plugin-provisional-overclaim.md
intent: Verify provisional skill handling and fallback source honesty.
reference_basis:
  - path: workspace/develop/eval/plugin/eval_goal.md
    basis: Provisional handling
  - path: workspace/docs/reference-index.md
    basis: Reference Gap
  - path: workspace/docs/skill-authoring.md
    basis: provisional skill criteria
target_behavior:
  required:
    - Targets architecture-implementation-patterns, implementation-django-ninja, and implementation-django-web.
    - Confirms fallback source status is visible in description/body/metadata.
    - Forbids claims that dedicated source references already exist.
  forbidden:
    - Treating DRF references as greenfield Django Ninja source.
    - Hiding provisional status only in an internal doc.
scoring_checks:
  - pass if each provisional skill has explicit allowed and forbidden wording.
  - fail if any provisional skill is called complete without source basis.
failure_modes:
  - provisional overclaim
  - DRF greenfield leakage
leakage_checks:
  - no private evaluation text in runtime skill.
evidence_required:
  - provisional status matrix
coverage_tags:
  - provisional-handling
  - reference-gap
  - drf-guardrail
