id: case-plugin-provisional-overclaim
case_id: case-plugin-provisional-overclaim
bucket: plugin
kind: plugin
public_case: workspace/develop/eval/plugin/cases/plugin/public/case-plugin-provisional-overclaim.md
intent: Verify source status honesty for dedicated and fallback/provisional skill references.
reference_basis:
  - path: workspace/develop/eval/plugin/eval_goal.md
    basis: Source status honesty
  - path: workspace/reference/source-reference-audit/reference/final.md
    basis: Dedicated source, gap, and provisional status
  - path: workspace/reference/architecture-implementation-patterns/reference/final.md
    basis: architecture-implementation-patterns dedicated source coverage
  - path: workspace/reference/implementation-django-ninja/reference/final.md
    basis: implementation-django-ninja dedicated source coverage and DRF guardrail alignment
  - path: workspace/reference/implementation-django-web/reference/final.md
    basis: implementation-django-web dedicated source coverage
  - path: dddjango/skills/source-reference-audit/SKILL.md
    basis: source status audit criteria
target_behavior:
  required:
    - Targets architecture-implementation-patterns, implementation-django-ninja, and implementation-django-web.
    - Checks whether each target has a dedicated `workspace/reference/<area>/reference/final.md` and whether that file covers the skill's main decisions before assigning dedicated or provisional status.
    - Confirms dedicated-source skills are not mislabeled as provisional, and source-gap skills do not hide fallback/provisional status in description/body/metadata.
    - Separates DRF guardrail review from source-status classification.
  forbidden:
    - Treating DRF references as greenfield Django Ninja source.
    - Claiming a skill is provisional merely because an older case expected it.
    - Hiding actual source gaps only in an internal doc.
scoring_checks:
  - pass if each target skill has explicit dedicated/provisional/gap status backed by source evidence.
  - pass if architecture-implementation-patterns dedicated source coverage is recognized instead of stale provisional wording.
  - fail if any skill is called complete without source basis or provisional despite sufficient dedicated source.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - stale provisional classification
  - dedicated source overclaim
  - DRF greenfield leakage
leakage_checks:
  - no private evaluation text in runtime skill.
evidence_required:
  - dedicated/provisional status matrix
  - source reference coverage check
  - runtime metadata honesty check
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - provisional-handling
  - source-status-honesty
  - reference-gap
  - drf-guardrail
