id: case-code-python-state
case_id: case-code-python-state
bucket: code
kind: code
public_case: workspace/develop/eval/code/cases/plugin/public/case-code-python-state.md
intent: Validate Python typing/value-object improvement without framework overreach.
reference_basis:
  - path: workspace/develop/eval/code/eval_goal.md
    basis: Python and clean code
  - path: workspace/docs/validation-plan.md
    basis: Python Typing
  - path: workspace/reference/implementation-python/reference/final.md
    basis: required reference source
code_expected: true
deterministic_checks:
  - id: unit-tests
    command: python3 -m unittest
    expected_exit: 0
    evidence: command-artifact
target_behavior:
  required:
    - Converts Money toward an explicit value object, using a frozen dataclass or equivalent while respecting the fixture Python version.
    - Preserves currency mismatch invariant and tests it.
    - Avoids pydantic as domain default and avoids unnecessary Protocol.
  forbidden:
    - Large architecture pattern introduction.
    - Weakening type contracts.
allowed_paths:
  - apps/payments/**
  - apps/orders/models.py
  - tests/**
forbidden_paths:
  - workspace/develop/eval/**
scoring_checks:
  - pass if type/value semantics are clearer and tests cover invariant.
  - fail if only annotations are changed with no behavioral protection.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - mutable value object remains unsafe
  - pydantic overuse
leakage_checks:
  - no private answer references.
evidence_required:
  - changed-files.json
  - diff.patch
  - test output
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - python-typing
  - dataclass
  - value-object
  - clean-code
