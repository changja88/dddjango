id: case-code-python-state
case_id: case-code-python-state
bucket: code
kind: code
public_case: workspace/develop/eval/code/cases/plugin/public/case-code-python-state.md
intent: Validate Python typing/value-object improvement without framework overreach.
reference_basis:
  - path: workspace/develop/eval/code/eval_goal.md
    basis: Python quality and code-backed validation honesty
  - path: workspace/reference/implementation-python/reference/final.md
    basis: Python type hints, Enum/StrEnum, dataclass value object, Protocol restraint, pydantic v2 boundary, Ruff/typecheck reporting
  - path: dddjango/skills/implementation-python/SKILL.md
    basis: implementation-python routing, runtime rules, and verification honesty
  - path: dddjango/skills/implementation-python/references/typing.md
    basis: public type contracts, X | None, built-in generics, Python version gate, Ruff/typecheck compatibility
  - path: dddjango/skills/implementation-python/references/dataclasses-enums.md
    basis: dataclass value object, Enum/StrEnum, and finite state guidance
  - path: dddjango/skills/implementation-python/references/protocols-boundaries.md
    basis: Protocol restraint and exception boundary guidance
  - path: dddjango/skills/implementation-python/references/pydantic-v2.md
    basis: pydantic v2 external boundary restraint
code_expected: true
case_role: implementation_supporting
deterministic_checks:
  - id: unit-tests
    command: python3 -m unittest
    expected_exit: 0
    evidence: command-artifact
target_behavior:
  required:
    - Preserves or improves public type contracts with project-compatible annotations and does not weaken None or collection element semantics.
    - Converts Money toward an explicit value object, using a frozen dataclass or equivalent while respecting the fixture Python version.
    - Preserves currency mismatch invariant and tests it.
    - Keeps order status as a meaningful explicit type, using Enum, StrEnum, or an equivalent project-compatible finite-state representation when appropriate.
    - Avoids pydantic as domain default and avoids unnecessary Protocol when there is no replaceable boundary.
    - Reports unit tests and any Ruff, mypy, or pyright checks that were run, or explicitly states when those checks were not run.
  forbidden:
    - Large architecture pattern introduction.
    - Weakening type contracts.
    - Moving Money or order state domain rules into pydantic validators as the default domain model.
    - Adding Protocols for one-off local classes without a replaceable boundary.
allowed_paths:
  - apps/payments/**
  - apps/orders/models.py
  - apps/orders/services.py
  - tests/**
forbidden_paths:
  - workspace/develop/eval/**
scoring_checks:
  - pass if type/value semantics are clearer and tests cover invariant.
  - fail if only annotations are changed with no behavioral protection.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
  - generated runtime artifacts such as db.sqlite3, __pycache__, .pyc, or .pytest_cache must not appear in changed-files.json.
failure_modes:
  - mutable value object remains unsafe
  - pydantic overuse
  - protocol overuse
  - false verification claim
leakage_checks:
  - no private answer references.
evidence_required:
  - changed-files.json
  - diff.patch
  - test output
control_case: false
expected_outcomes:
  baseline: pass
  with_dddjango: pass
  expected_delta: neutral
  baseline_pass_ok: true
baseline_pass_ok_reason: Repeated targeted runs showed the scoped Python typing/value-object case can be satisfied by baseline as well as with-dddjango; this case now gates artifact-backed behavior, command honesty, Python-boundary restraint, and leakage rather than requiring a brittle score delta.
coverage_tags:
  - code-implementation-python
  - implementation-python
  - python-typing
  - python-type-contracts
  - dataclass-value-object
  - enum-strenum
  - protocol-boundary
  - pydantic-v2-boundary
  - ruff-typecheck
  - python-version-gate
  - command-honesty
  - validation-honesty
  - clean-code
