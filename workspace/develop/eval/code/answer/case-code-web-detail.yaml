id: case-code-web-detail
case_id: case-code-web-detail
bucket: code
kind: code
public_case: workspace/develop/eval/code/cases/plugin/public/case-code-web-detail.md
intent: Check Django Web implementation boundary and safe rendering-oriented changes.
reference_basis:
  - path: workspace/develop/eval/code/eval_goal.md
    basis: Django Web code-backed implementation scenario
  - path: workspace/reference/implementation-django-web/reference/final.md
    basis: Django Web source reference direct 기준
  - path: dddjango/skills/implementation-django-web/SKILL.md
    basis: runtime routing, handoff, render/static acceptance rules
  - path: dddjango/skills/implementation-django-web/references/templates.md
    basis: presentation-only template, base/include/static linking boundary
  - path: dddjango/skills/implementation-django-web/references/static-assets.md
    basis: changed static files must be referenced by rendered page
  - path: dddjango/skills/implementation-django-web/references/templateview-htmx.md
    basis: view context preparation and display-ready fallback values
code_expected: true
case_role: implementation_supporting
deterministic_checks:
  - id: unit-tests
    command: python3 -m unittest
    expected_exit: 0
    evidence: command-artifact
behavior_checks:
  - id: hidden-web-detail-render-boundary
    command: python3 workspace/scripts/eval_code_behavior_checks.py --case case-code-web-detail
    expected_exit: 0
target_behavior:
  required:
    - Keeps TemplateView/view context, template, and static changes focused on presentation.
    - Keeps base/include decisions small and only extracts a fragment when repetition and shared change justify it.
    - Provides display-ready fallback values for optional fields such as empty memo.
    - Renders display context values in the template instead of raw domain status or memo fields.
    - References changed/existing static CSS from the rendered template or clearly removes unused CSS.
    - Confirms render acceptance with a small render/context/unit or compile-level test and reports any not-run browser/collectstatic/security checks honestly.
    - Avoids domain state changes in template/view context.
    - Adds a small test or compile-level verification.
    - Touches template/static/view files only as needed.
  forbidden:
    - Moving business rules into HTML conditionals.
    - Rewriting API/domain architecture for a page display task.
allowed_paths:
  - apps/orders/views.py
  - apps/orders/templates/**
  - apps/orders/static/**
  - tests/**
forbidden_paths:
  - apps/orders/api.py
  - workspace/develop/eval/**
scoring_checks:
  - pass if display code is clearer and domain logic remains outside template.
  - fail if template owns state decisions.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
  - generated runtime artifacts such as db.sqlite3, __pycache__, .pyc, or .pytest_cache must not appear in changed-files.json.
failure_modes:
  - template business logic
  - no verification
leakage_checks:
  - private oracle content absent from fixture changes.
evidence_required:
  - changed-files.json
  - diff.patch
  - compile/test output
  - behavior check output
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - django-web
  - implementation-django-web
  - code-implementation-django-web
  - template-context
  - template-static
  - safe-rendering
  - static-reference
  - render-acceptance
  - validation-honesty
