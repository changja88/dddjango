id: case-code-coupon-tdd
case_id: case-code-coupon-tdd
bucket: code
kind: code
public_case: workspace/develop/eval/code/cases/plugin/public/case-code-coupon-tdd.md
intent: Validate TDD/test implementation for coupon policy boundaries.
reference_basis:
  - path: workspace/develop/eval/code/eval_goal.md
    basis: TDD/test implementation
  - path: workspace/reference/implementation-tdd/reference/final.md
    basis: required reference source
  - path: dddjango/skills/implementation-tdd/SKILL.md
    basis: runtime TDD method ownership and execution honesty
  - path: dddjango/skills/implementation-tdd/references/test-list.md
    basis: boundary pairs and independent decision axes
  - path: dddjango/skills/implementation-tdd/references/red-green-refactor.md
    basis: Red-Green-Refactor and immediate-pass characterization rule
  - path: dddjango/skills/implementation-tdd/references/inside-out-outside-in.md
    basis: state/output verification for domain policy
  - path: workspace/reference/implementation-test/reference/final.md
    basis: required reference source
code_expected: true
case_role: implementation_supporting
deterministic_checks:
  - id: unit-tests
    command: python3 -m unittest
    expected_exit: 0
    evidence: command-artifact
  - id: compileall
    command: python3 -m compileall -q apps tests
    expected_exit: 0
    evidence: command-artifact
behavior_checks:
  - id: hidden-coupon-red-proof
    command: python3 workspace/scripts/eval_code_behavior_checks.py --case case-code-coupon-tdd-red-proof
    expected_exit: 1
  - id: hidden-coupon-policy-boundaries
    command: python3 workspace/scripts/eval_code_behavior_checks.py --case case-code-coupon-tdd
    expected_exit: 0
target_behavior:
  required:
    - Adds or identifies the first failing test for a currently missing coupon rule before implementing the fix; if a new test already passes, reports it as characterization/regression coverage rather than a red test.
    - Adds behavior tests for minimum amount accepted boundary and nearest rejected/complement amount below the minimum.
    - Adds behavior tests for expiration day accepted, day after expiration rejected, and used coupon rejected as separate policy axes.
    - Makes the minimal Green implementation needed for the used-coupon gap and avoids unrelated policy or architecture changes.
    - Reports Red-Green-Refactor intent honestly; no claim of seeing failing tests unless actually run, and refactors only after tests are green.
    - Prefers output or state verification of coupon policy outcomes over private implementation details.
  forbidden:
    - Testing private implementation details instead of policy behavior.
    - Adding broad DB/API architecture.
allowed_paths:
  - apps/coupons/**
  - tests/**
forbidden_paths:
  - apps/orders/api.py
  - workspace/develop/eval/**
scoring_checks:
  - pass if tests protect policy outcomes and implementation is minimal.
  - fail if no boundary tests are added.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
  - generated runtime artifacts such as db.sqlite3, __pycache__, .pyc, or .pytest_cache must not appear in changed-files.json.
failure_modes:
  - missing edge cases
  - overbroad refactor
leakage_checks:
  - answer-only test expectations not copied verbatim into public artifacts.
evidence_required:
  - changed-files.json
  - diff.patch
  - unit test output
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - code-implementation-tdd
  - implementation-tdd
  - tdd
  - failing-test-first
  - boundary-cases
  - red-green-refactor
  - state-verification
  - test-implementation
  - domain-policy
  - validation-honesty
