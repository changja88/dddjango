id: case-code-order-api
case_id: case-code-order-api
bucket: code
kind: code
public_case: workspace/develop/eval/code/cases/plugin/public/case-code-order-api.md
intent: Verify code-backed DDD/API/DB mapping for idempotent order creation.
reference_basis:
  - path: workspace/develop/eval/code/eval_goal.md
    basis: DDD-to-code, Django Ninja API, DB consistency
  - path: workspace/reference/architecture-ddd/reference/final.md
    basis: aggregate invariant and application-service boundary
  - path: workspace/reference/architecture-db/reference/final.md
    basis: uniqueness, transaction boundary, idempotency storage, and duplicate prevention
  - path: workspace/reference/architecture-api/reference/final.md
    basis: Idempotency-Key replay/conflict and Problem Details contract
  - path: workspace/reference/implementation-django/reference/final.md
    basis: Django service/selector and transaction implementation boundary
  - path: workspace/reference/implementation-django-ninja/reference/final.md
    basis: thin Router/Schema adapter and Problem Details mapping
  - path: workspace/reference/implementation-test/reference/final.md
    basis: API replay/conflict and concurrency test evidence
  - path: dddjango/skills/architecture-db/references/constraints-indexes.md
    basis: unique constraint and duplicate prevention
  - path: dddjango/skills/architecture-db/references/transactions-locking.md
    basis: transaction, lock, retry, and idempotency storage decisions
  - path: dddjango/skills/architecture-api/references/idempotency-openapi.md
    basis: Idempotency-Key replay/conflict behavior
  - path: dddjango/skills/implementation-django/references/services-selectors.md
    basis: service-owned order creation and idempotency decision
  - path: dddjango/skills/implementation-django/references/transactions-performance-security.md
    basis: transaction.atomic, on_commit, and command honesty
  - path: dddjango/skills/implementation-django-ninja/references/problem-details-openapi.md
    basis: Problem Details and API adapter mapping
  - path: dddjango/skills/implementation-test/references/django-api-concurrency.md
    basis: replay, conflict, and race fallback tests
code_expected: true
case_role: implementation_supporting
deterministic_checks:
  - id: python-compile
    command: python3 -m compileall apps/orders shop_service
    expected_exit: 0
    evidence: command-artifact
  - id: django-tests
    command: python3 manage.py test
    expected_exit: 0
    evidence: command-artifact
  - id: django-check
    command: python3 manage.py check
    expected_exit: 0
    evidence: command-artifact
target_behavior:
  required:
    - Keeps API function thin and moves idempotency/order creation decisions into service or narrow helper.
    - Stores idempotency key with request fingerprint and replay/conflict behavior.
    - Replays the same order response payload for same-key/same-payload requests; an explicit replay indicator such as replayed=true is allowed when it is already part of the API schema.
    - Adds tests for replay and conflict cases.
    - Reports compile/unit test command results or honest not-run reason.
  forbidden:
    - Business rule directly owned by API adapter.
    - DRF serializer/viewset introduction.
    - Repository/UoW/hexagonal structure unless justified by actual fixture need.
allowed_paths:
  - apps/orders/**
  - tests/**
forbidden_paths:
  - workspace/develop/eval/**
  - dddjango/**
scoring_checks:
  - pass if diff includes service-side idempotency and tests for same-key replay and payload conflict.
  - fail if it only adds prose or untested placeholder fields.
score_interpretation: API/DB consistency support score; do not count this as direct DDD-shaped aggregate implementation confidence.
consistency_observations:
  application_service_boundary: Order creation and idempotency decisions live in the service/usecase layer; the Ninja router validates input, reads headers, calls the service, and maps errors to Problem Details.
  transaction_boundary: The service owns the atomic section around idempotency lookup/create and unique constraint conflict handling.
  idempotency_storage: Persistence stores idempotency key, request fingerprint, and replay snapshot.
  replay_response: Same-key/same-payload replay returns the original order payload without creating another row; the API may set an explicit replay marker if the fixture schema exposes one.
  problem_details: Missing key and payload conflict return Problem Details shaped responses.
  tests:
    - same key and same payload replays same response.
    - same key and different payload returns conflict.
    - API remains a thin adapter.
    - DB race fallback does not create duplicate orders.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
  - generated runtime artifacts such as db.sqlite3, __pycache__, .pyc, or .pytest_cache must not appear in changed-files.json.
failure_modes:
  - same-key replay still surfaces a raw database error
  - conflict not distinguishable
  - false command success
leakage_checks:
  - answer oracle and private paths must not be read or copied.
evidence_required:
  - changed-files.json
  - diff.patch
  - copied source files
  - command output or not-run reason
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - ddd-to-code
  - django-ninja-api
  - db-consistency
  - idempotency
