id: case-workflow-parallel-ownership
case_id: case-workflow-parallel-ownership
bucket: workflow
kind: workflow
public_case: workspace/develop/eval/workflow/cases/plugin/public/case-workflow-parallel-ownership.md
intent: Validate disjoint file ownership when workflow work is split across parallel roles.
reference_basis:
  - path: workspace/develop/eval/workflow/eval_goal.md
    basis: handoff contract, delegation honesty, and role responsibility split
  - path: workspace/docs/workflow.md
    basis: role decomposition and handoff fields
  - path: dddjango/skills/workflow-dddjango-subagents/SKILL.md
    basis: explicit file ownership with May edit and Must not edit
  - path: dddjango/skills/workflow-dddjango-subagents/references/handoff-contract.md
    basis: no overlapping write sets and role handoff discipline
target_behavior:
  required:
    - Uses actual subagents when available because the user explicitly authorized real parallel subagent use.
    - Provides role handoffs for Domain, DB, API, and Test with concrete scopes before or during dispatch.
    - Each role includes Files with May edit and Must not edit.
    - May edit ownership is disjoint across roles or explicitly read-only for review-only roles.
    - Must not edit prevents overlapping writes to the same files or modules.
    - Includes integration owner or merge rule for reconciling outputs.
    - Reports actual trace, result collection evidence, and role outputs if subagents ran; reports a concrete blocker if they could not run.
  forbidden:
    - Assigning the same file or module to multiple roles for concurrent editing without a clear single owner.
    - Omitting Must not edit boundaries.
    - Replacing the authorized actual subagent run with a decorative plan when subagents are available.
    - Claiming parallel execution without trace evidence.
workflow_execution_expectation:
  expected_mode: actual_subagent_required
  acceptable_modes:
    - actual_subagent
  forbidden_modes:
    - direct
    - sequential_fallback
    - false_actual_claim
  decision_rule: Because the user explicitly authorized actual parallel subagent use, the answer should dispatch real bounded subagents when available.
  responsibility_rule: Each subagent must receive non-overlapping responsibility, May edit, Must not edit, expected output, risks, and integration handoff.
  report_label: actual subagents with clear ownership
scoring_checks:
  - pass if actual subagent trace includes dispatch and result collection evidence, and each dispatched role has concrete non-overlapping ownership.
  - partial if subagent execution is blocked for an explicit runtime reason but the planned handoff is otherwise concrete.
  - fail if it only writes a plan despite available subagents, fabricates execution, overlaps write ownership, or omits Must not edit.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - overlapping write ownership
  - missing must-not-edit boundaries
  - false actual delegation claim
  - no integration owner
  - decorative role split
leakage_checks:
  - public response must not reveal evaluator-only oracle, scoring checks, hidden ownership criterion, or answer file content.
evidence_required:
  - final workflow response transcript
  - handoff contract or role table
  - subagent trace summary with actual dispatch and result collection events
  - integration owner or merge rule
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - actual-subagent-required
  - actual-subagent-trace
  - handoff-contract
  - parallel-ownership
  - delegation-honesty
  - responsibility-split
  - integration-closure
