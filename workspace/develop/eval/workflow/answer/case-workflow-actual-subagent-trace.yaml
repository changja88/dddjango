id: case-workflow-actual-subagent-trace
case_id: case-workflow-actual-subagent-trace
bucket: workflow
kind: workflow
public_case: workspace/develop/eval/workflow/cases/plugin/public/case-workflow-actual-subagent-trace.md
intent: Define evidence required when actual subagents were used versus sequential fallback.
reference_basis:
  - path: workspace/develop/eval/workflow/eval_goal.md
    basis: actual-subagent trace
  - path: workspace/docs/workflow.md
    basis: handoff contract and integration checklist
target_behavior:
  required:
    - Distinguishes actual execution trace from planned roles.
    - Requires result collection evidence, role output summaries, files may edit/must not edit, risks, follow-up, and integration closure.
    - Requires fallback statement if no subagents ran.
  forbidden:
    - Saying agents reviewed when only main-agent analysis occurred.
workflow_execution_expectation:
  expected_mode: evidence_protocol_required
  acceptable_modes:
    - actual_subagent
    - sequential_fallback
  forbidden_modes:
    - false_actual_claim
    - role_names_without_trace
  decision_rule: Actual subagent use is not mandatory, but the answer must define when trace is required and when fallback wording is required.
  responsibility_rule: Actual subagent reports must include result collection evidence, role outputs, file ownership, risks, follow-up, and integration closure.
  report_label: actual trace or honest fallback evidence
scoring_checks:
  - pass if evidence requirements are explicit and falsifiable.
  - fail if trace can be satisfied by role names only.
failure_modes:
  - no execution trace
  - vague handoff
leakage_checks:
  - no private run findings copied into public prompt.
evidence_required:
  - subagent ids, dispatch trace, and result collection evidence when actual
  - fallback transcript when sequential
coverage_tags:
  - actual-subagent-trace
  - handoff-contract
  - delegation-honesty
