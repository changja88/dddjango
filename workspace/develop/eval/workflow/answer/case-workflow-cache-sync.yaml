id: case-workflow-cache-sync
case_id: case-workflow-cache-sync
bucket: workflow
kind: workflow
public_case: workspace/develop/eval/workflow/cases/plugin/public/case-workflow-cache-sync.md
intent: Confirm workflow cache sync reporting after role-map changes.
reference_basis:
  - path: workspace/develop/eval/workflow/eval_goal.md
    basis: cache sync report
  - path: dddjango/skills/workflow-dddjango-subagents/references/role-map.md
    basis: Cache sync report
  - path: dddjango/.codex-plugin/plugin.json
    basis: Runtime synchronization criteria
target_behavior:
  required:
    - Reports canonical workspace source change and cache path touched.
    - Confirms runtime role-map responsibilities did not shrink from dddjango/skills/workflow-dddjango-subagents/references/role-map.md.
    - Requires validation command output or explicit not-run reason.
  forbidden:
    - Reporting cache-only update as complete.
    - Omitting workspace source evidence.
workflow_execution_expectation:
  expected_mode: direct_report_required
  acceptable_modes:
    - direct
    - sequential_fallback
  forbidden_modes:
    - false_actual_claim
    - actual_subagent
  decision_rule: Cache sync reporting does not require subagents; the response should focus on source/cache evidence.
  responsibility_rule: If roles are mentioned, they must preserve the existing role map and not shrink ownership.
  report_label: direct cache sync evidence
scoring_checks:
  - pass if workspace/cache evidence and validation status are both present.
  - fail if only runtime cache is mentioned.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - cache-only completion
  - role-map shrink
leakage_checks:
  - no answer or prior run content in cache report.
evidence_required:
  - workspace source path
  - cache path
  - validation output
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - cache-sync-report
  - role-map-sync
  - completion-honesty
