id: case-workflow-review-focused
case_id: case-workflow-review-focused
bucket: workflow
kind: workflow
public_case: workspace/develop/eval/workflow/cases/plugin/public/case-workflow-review-focused.md
intent: Ensure review requests lead with findings before optional workflow planning.
reference_basis:
  - path: workspace/develop/eval/workflow/eval_goal.md
    basis: review-focused workflow
  - path: dddjango/skills/workflow-dddjango-subagents/references/role-map.md
    basis: review task flow
  - path: dddjango/skills/source-reference-audit/SKILL.md
    basis: implementation-cleancode and review boundaries
target_behavior:
  required:
    - Findings first, ordered by severity with concrete risk.
    - Optional workflow/handoff sections appear after findings only if useful.
    - Separates Router adapter issues, model/domain invariant issues, side-effect timing, and test gaps.
  forbidden:
    - Starting with role map before findings.
    - Generic "split responsibilities" without grounded findings.
workflow_execution_expectation:
  expected_mode: review_findings_first
  acceptable_modes:
    - direct
    - sequential_fallback
    - actual_subagent
  forbidden_modes:
    - false_actual_claim
  decision_rule: Review findings must lead; subagents are useful only if authorized or clearly needed after the primary review stance.
  responsibility_rule: Any follow-up role split must map concrete findings to Router/API, model/domain, side-effect, and test responsibilities.
  report_label: findings first, workflow optional
scoring_checks:
  - pass if findings-first stance and follow-up workflow are both respected.
  - fail if the review is buried under process.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - no severity ordering
  - process before findings
leakage_checks:
  - no answer oracle references.
evidence_required:
  - review transcript
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - review-focused
  - findings-first
