id: case-workflow-risky-write
case_id: case-workflow-risky-write
bucket: workflow
kind: workflow
public_case: workspace/develop/eval/workflow/cases/plugin/public/case-workflow-risky-write.md
intent: Validate Risky Write Consistency Block for concurrency-heavy design.
reference_basis:
  - path: workspace/develop/eval/workflow/eval_goal.md
    basis: risky write consistency
  - path: dddjango/skills/workflow-dddjango-subagents/SKILL.md
    basis: risky write workflow output shape and required consistency block
  - path: dddjango/skills/workflow-dddjango-subagents/references/integration-checklist.md
    basis: transaction owner, locking, idempotency, side-effect timing, retry, and test criteria
  - path: workspace/develop/eval/workflow/cases/plugin/public/case-workflow-risky-write.md
    basis: transaction and concurrency
target_behavior:
  required:
    - Includes transaction owner, locking/isolation, uniqueness/idempotency storage, external side effect timing, retry, and concurrency test criteria.
    - Connects Domain/DB/API/Django/Test decisions in integration order.
    - Does not treat transaction.atomic alone as sufficient.
  forbidden:
    - External payment side effects before durable commit without mitigation.
    - Missing idempotency conflict/replay decision.
workflow_execution_expectation:
  expected_mode: risky_write_decisions_required_without_subagents
  acceptable_modes:
    - direct
    - sequential_fallback
  forbidden_modes:
    - actual_subagent
    - false_actual_claim
  decision_rule: Risky write design may be direct or sequential workflow, but it must include the consistency decision set and the public request does not authorize actual subagents.
  responsibility_rule: Domain, DB, API, Django, and Test decisions must be connected with transaction and side-effect ownership.
  report_label: risky write decisions required
scoring_checks:
  - pass if all risky write fields are present and mutually consistent.
  - fail if concurrency is generic.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - side-effect timing omitted
  - no concurrency tests
leakage_checks:
  - no private oracle wording.
evidence_required:
  - risky write block
  - integration checklist
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - risky-write-consistency
  - transaction-concurrency
  - integration-closure
