id: case-workflow-positive-composite
case_id: case-workflow-positive-composite
bucket: workflow
kind: workflow
public_case: workspace/develop/eval/workflow/cases/plugin/public/case-workflow-positive-composite.md
intent: Validate full positive composite workflow for risky order/payment/inventory work.
reference_basis:
  - path: workspace/develop/eval/workflow/eval_goal.md
    basis: positive composite workflow
  - path: dddjango/skills/workflow-dddjango-subagents/references/role-map.md
    basis: canonical role responsibilities
  - path: dddjango/skills/workflow-dddjango-subagents/references/delegation-rules.md
    basis: sequential fallback, actual subagent boundary, critical-path restraint
  - path: dddjango/skills/workflow-dddjango-subagents/references/handoff-contract.md
    basis: handoff fields and role-level file ownership
  - path: dddjango/skills/workflow-dddjango-subagents/references/integration-checklist.md
    basis: integration owner, risky write consistency, validation sharing, and risk closure
  - path: workspace/develop/eval/workflow/cases/plugin/public/case-workflow-positive-composite.md
    basis: order creation API
target_behavior:
  required:
    - Uses Role Map with Domain, Architecture, DB, API, Django, TDD/Test, Review, Integration responsibilities.
    - If subagents are available, delegates honestly; otherwise uses sequential fallback in canonical order.
    - Includes Handoff Contract fields: Scope, Inputs Used, Decisions, Files with May edit and Must not edit, Output, Risks, Required Follow-up, and dddjango Checks.
    - Includes Integration Checklist with integration owner and role-level risk closure.
    - Includes Risky Write Consistency Block for aggregate invariant, transaction owner, locking/isolation, uniqueness/idempotency storage, `Idempotency-Key` replay/conflict, side-effect timing, retry/isolation, and concurrency/integration tests.
    - Names the integration owner and closes or carries role-level risks and required follow-up.
  forbidden:
    - Skipping DDD and starting at Django code structure.
    - Claiming actual subagent execution without trace.
workflow_execution_expectation:
  expected_mode: workflow_required_subagent_optional
  acceptable_modes:
    - actual_subagent
    - sequential_fallback
  forbidden_modes:
    - direct
    - false_actual_claim
  decision_rule: This composite risky work requires workflow decomposition; actual subagents are optional unless authorized and available.
  responsibility_rule: Role responsibilities must cover Domain, Architecture, DB, API, Django, TDD/Test, Review, and Integration with handoff fields.
  report_label: workflow required, subagent optional
scoring_checks:
  - pass if role decisions are concrete and integration closes risks.
  - fail if roles are only names with no handoff content.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - missing Role Map
  - missing risky write block
  - shallow consistency block
  - no integration owner
  - false delegation claim
leakage_checks:
  - no private answer content in workflow response.
evidence_required:
  - workflow transcript
  - handoff artifact
  - integration checklist
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - positive-composite
  - handoff-contract
  - integration-checklist
  - responsibility-split
  - risky-write-consistency
  - delegation-honesty
  - integration-closure
