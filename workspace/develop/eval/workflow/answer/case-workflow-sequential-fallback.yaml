id: case-workflow-sequential-fallback
case_id: case-workflow-sequential-fallback
bucket: workflow
kind: workflow
public_case: workspace/develop/eval/workflow/cases/plugin/public/case-workflow-sequential-fallback.md
intent: Check sequential fallback order and handoff decisions when subagents cannot run.
reference_basis:
  - path: workspace/develop/eval/workflow/eval_goal.md
    basis: sequential fallback
  - path: dddjango/skills/workflow-dddjango-subagents/references/role-map.md
    basis: Sequential Fallback
  - path: dddjango/skills/workflow-dddjango-subagents/references/delegation-rules.md
    basis: required reference source
target_behavior:
  required:
    - Explicitly says subagents are not being executed.
    - Preserves Domain, Architecture, DB, API, Django, TDD/Test, Review, Integration order.
    - Records decisions and required follow-up for each stage.
  forbidden:
    - Inventing subagent results.
    - Reordering implementation before domain/DB/API decisions.
workflow_execution_expectation:
  expected_mode: sequential_fallback_required
  acceptable_modes:
    - sequential_fallback
  forbidden_modes:
    - actual_subagent
    - false_actual_claim
  decision_rule: The public request assumes subagents cannot run, so the answer must not use or claim actual subagents.
  responsibility_rule: Sequential roles must preserve Domain, Architecture, DB, API, Django, TDD/Test, Review, Integration order and handoff decisions.
  report_label: sequential fallback required
scoring_checks:
  - pass if fallback is honest and ordered.
  - fail if it calls the sequential sections subagent outputs.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - false subagent trace
  - wrong order
leakage_checks:
  - no evaluator-only text.
evidence_required:
  - sequential workflow transcript
control_case: restraint
expected_outcomes:
  baseline: pass-or-partial
  with_dddjango: pass
  expected_delta: non-negative
  baseline_pass_ok: true
coverage_tags:
  - sequential-fallback
  - delegation-honesty
