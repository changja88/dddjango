id: case-workflow-design-no-meta-tail
case_id: case-workflow-design-no-meta-tail
bucket: workflow
kind: workflow
public_case: workspace/develop/eval/workflow/cases/plugin/public/case-workflow-design-no-meta-tail.md
intent: Check that direct design-only answers preserve requested shape without meta reporting tails.
reference_basis:
  - path: workspace/develop/eval/workflow/eval_goal.md
    basis: negative workflow restraint and over-ceremony control
  - path: dddjango/skills/workflow-dddjango-subagents/SKILL.md
    basis: Direct Answer Mode and direct implementation reporting boundary
  - path: dddjango/skills/workflow-dddjango-subagents/references/delegation-rules.md
    basis: pure answer-only output shape and no meta tail rule
target_behavior:
  required:
    - Ends after exactly five design-decision bullets or an equivalent five-item list.
    - Each item contains a real reservation or inventory design decision.
    - Avoids Role Map, Handoff Contract, Integration Checklist, subagent plan, command report, check report, tool report, and Serena note.
    - Does not claim files, commands, tests, or subagents were used.
  forbidden:
    - Spending any requested bullet on meta reporting instead of design content.
    - Appending commands run, checks not run, no-subagent, skill loading, or tool-use footer after the five bullets.
scoring_checks:
  - pass if the answer respects the requested five-item shape and all items are domain/design content.
  - partial if the answer has useful design decisions but adds a small meta tail or wrong item count.
  - fail if workflow ceremony, subagent planning, or command/check/Serena footer changes the requested output shape.
failure_modes:
  - meta tail after requested shape
  - wrong item count
  - workflow over-ceremony
  - false execution claim
leakage_checks:
  - public response must not reveal evaluator-only shape checks, scoring checks, answer file content, or hidden failure labels.
evidence_required:
  - final response transcript
  - item count and footer inspection
coverage_tags:
  - tiny-task-restraint
  - direct-answer-shape
  - meta-tail-restraint
  - subagent-opt-out
  - delegation-honesty
