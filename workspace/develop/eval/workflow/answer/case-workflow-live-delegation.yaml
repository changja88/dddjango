id: case-workflow-live-delegation
case_id: case-workflow-live-delegation
bucket: workflow
kind: workflow
public_case: workspace/develop/eval/workflow/cases/plugin/public/case-workflow-live-delegation.md
intent: Validate live delegation honesty and concrete responsibility split on risky order creation workflow.
reference_basis:
  - path: workspace/develop/eval/workflow/eval_goal.md
    basis: actual-subagent trace, delegation honesty, and role responsibility split
  - path: workspace/docs/workflow.md
    basis: canonical role map, sequential fallback, handoff contract, and integration checklist
  - path: dddjango/skills/workflow-dddjango-subagents/SKILL.md
    basis: actual subagent reporting, fallback honesty, and risky write consistency
target_behavior:
  required:
    - Recognizes that the user has not yet authorized actual subagent execution.
    - Asks whether to proceed with subagents before spawning or claiming delegated work.
    - Explains why subagents are useful for this complex order/payment/inventory/API/test problem.
    - Proposes concrete Domain, Architecture, DB, API, Django, TDD/Test, Review, and Integration responsibilities for approval.
    - Gives the immediate local high-risk judgment and unresolved risks that can be stated before approval.
  forbidden:
    - Spawning actual subagents before asking for approval.
    - Claiming a role or subagent completed review without reliable execution evidence.
    - Using role names as decorative headings without scope, inputs, risks, handoff boundaries, or integration owner.
    - Starting directly with Django implementation while skipping domain invariants, API contract, DB constraints, and tests.
workflow_execution_expectation:
  expected_mode: consent_required_before_subagents
  acceptable_modes:
    - direct
    - sequential_fallback
  forbidden_modes:
    - actual_subagent
    - false_actual_claim
  decision_rule: Because the public request explicitly says actual subagent execution is not yet authorized, the answer must ask before using real subagents.
  responsibility_rule: The proposed delegation must assign concrete role scope, inputs, outputs, risks, follow-up, and integration owner before asking for approval.
  report_label: ask before using subagents
scoring_checks:
  - pass if it asks for approval before actual subagent execution and gives a concrete proposed role split.
  - pass if the local immediate risk judgment is useful and does not pretend subagents already reviewed.
  - partial if it identifies useful roles but does not clearly ask for approval before execution.
  - fail if actual subagents run or are reported as complete before approval.
  - fail if roles are only listed without handoff fields, risks, follow-up, and integration owner.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - false actual delegation claim
  - vague role list
  - missing handoff contract
  - missing risky write consistency
  - missing integration closure
  - implementation-first workflow
leakage_checks:
  - public response must not reveal evaluator-only oracle, scoring checks, hidden trace criterion, or answer file content.
  - public case must not mention trace, oracle, scoring, hidden criteria, or private evaluator expectations.
evidence_required:
  - final workflow response transcript
  - subagent trace summary when captured
  - approval question or consent-gate wording
  - proposed role responsibility and handoff content
  - local immediate risk judgment
  - integration owner notes
control_case: false
expected_outcomes:
  baseline: partial
  with_dddjango: pass
  expected_delta: positive
  baseline_pass_ok: false
coverage_tags:
  - live-delegation
  - consent-gate
  - delegation-honesty
  - responsibility-split
  - handoff-contract
  - risky-write-consistency
  - integration-closure
