id: case-workflow-tiny-restraint
case_id: case-workflow-tiny-restraint
bucket: workflow
kind: workflow
public_case: workspace/develop/eval/workflow/cases/plugin/public/case-workflow-tiny-restraint.md
intent: Check that tiny explanatory requests do not trigger workflow output.
reference_basis:
  - path: workspace/develop/eval/workflow/eval_goal.md
    basis: tiny-task restraint
  - path: workspace/docs/workflow.md
    basis: simple task restraint
target_behavior:
  required:
    - Answers in two concise sentences.
    - Avoids role map, handoff, subagents, DDD modeling, and test plan.
  forbidden:
    - Full dddjango workflow for a short explanation.
workflow_execution_expectation:
  expected_mode: direct_required
  acceptable_modes:
    - direct
  forbidden_modes:
    - actual_subagent
    - sequential_fallback
    - false_actual_claim
  decision_rule: The request is a two-sentence explanation, so asking to use subagents or running workflow is over-application.
  responsibility_rule: No responsibility split is needed; the response should be concise and direct.
  report_label: direct answer only
scoring_checks:
  - pass if concise and direct.
  - fail if it introduces workflow ceremony.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - over-ceremony
  - exceeds requested scope
leakage_checks:
  - no private answer content.
evidence_required:
  - response transcript
control_case: restraint
expected_outcomes:
  baseline: pass-or-partial
  with_dddjango: pass
  expected_delta: non-negative
  baseline_pass_ok: true
coverage_tags:
  - tiny-task-restraint
  - simple-negative
