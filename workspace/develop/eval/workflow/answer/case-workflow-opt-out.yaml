id: case-workflow-opt-out
case_id: case-workflow-opt-out
bucket: workflow
kind: workflow
public_case: workspace/develop/eval/workflow/cases/plugin/public/case-workflow-opt-out.md
intent: Ensure explicit user opt-out prevents full workflow ceremony for small rename.
reference_basis:
  - path: workspace/develop/eval/workflow/eval_goal.md
    basis: subagent opt-out
  - path: dddjango/skills/workflow-dddjango-subagents/references/role-map.md
    basis: simple task and opt-out restraint
  - path: workspace/develop/eval
    basis: simple field rename
target_behavior:
  required:
    - Acknowledges no full role decomposition is needed.
    - Provides only minimal migration/rename considerations.
    - Does not output Role Map, Handoff Contract, or Integration Checklist.
  forbidden:
    - Ignoring opt-out and producing workflow sections.
workflow_execution_expectation:
  expected_mode: direct_required
  acceptable_modes:
    - direct
  forbidden_modes:
    - actual_subagent
    - sequential_fallback
    - false_actual_claim
  decision_rule: The user explicitly opted out of subagent planning and full workflow decomposition.
  responsibility_rule: No subagent responsibility assignment is needed for this small rename.
  report_label: direct response, opt-out honored
scoring_checks:
  - pass if response is short and scoped.
  - fail if workflow is over-applied.
hard_gates:
  - no evaluator-only answer material, private scoring notes, or prior run findings leak into public/runtime output.
  - claimed command execution, file inspection, tests, or subagent execution must be supported by run artifacts or explicit response evidence.
failure_modes:
  - opt-out ignored
  - ceremony overload
leakage_checks:
  - no private answer text.
evidence_required:
  - response transcript
control_case: restraint
expected_outcomes:
  baseline: pass-or-partial
  with_dddjango: pass
  expected_delta: non-negative
  baseline_pass_ok: true
coverage_tags:
  - subagent-opt-out
  - tiny-task-restraint
