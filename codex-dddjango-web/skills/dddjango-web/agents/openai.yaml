interface:
  display_name: "dddjango-web"
  short_description: "Django 화면을 간소화 DDD+MVVM으로 요구→설계→구현까지 게이트로 빌드"
  default_prompt: "dddjango-web으로 기존 Django 프로젝트에 한 기능의 화면(HTML · HTMX · JS)을 간소화 DDD+MVVM으로 빌드한다(요구 G0 → 설계 G1 → 구현 G2). 요청은 순서대로 준다 — ① 기능 설명(큰따옴표로 감싼다), ② (선택) OpenAPI 문서 위치(이 프로젝트 안 경로 `/api/openapi.json` 꼴 · 파일 경로 · http(s) 주소). 디자인은 인자가 아니라 G0에서 정한다(Claude Design 프로젝트·내려받은 Claude Design 시안 폴더·로컬 이미지·자체 설계). 예: \"날씨 7일 예보 화면\"을 만들어줘 /api/openapi.json"
