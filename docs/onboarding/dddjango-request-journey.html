<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dddjango — 하나의 요청이 지나가는 길</title>
</head>
<body>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --ground: #eef1f4;
    --paper: #f6f8fa;
    --card: #ffffff;
    --ink: #20272e;
    --muted: #5a6672;
    --faint: #8b96a1;
    --hair: #dbe1e7;
    --grey-node: #aab3bc;

    --pres: #b26b1e;    /* presentation — 앰버 */
    --app:  #2c6db0;    /* application — 블루 */
    --dom:  #2f855a;    /* domain — 에메랄드 */
    --infra:#6d4bb8;    /* infra — 바이올렛 */
    --wire: #4a5560;    /* composition — 슬레이트 */
    --ohs:  #c0338c;    /* OHS 계약 / BC 경계 — 로즈 */
    --http: #5a6672;    /* HTTP 진입/반환 */
    --err:  #ce3e36;    /* 에러 분기 */

    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;

    --shadow: 0 1px 2px rgba(28,40,54,.05), 0 8px 24px rgba(28,40,54,.06);
  }

  html, body { margin: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--ground);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1320px; margin: 0 auto; padding: 22px clamp(14px, 3vw, 30px) 60px; }

  /* ---------- header ---------- */
  header.top { margin-bottom: 18px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--faint); margin: 0 0 8px;
  }
  h1 {
    font-size: clamp(21px, 3.2vw, 30px); line-height: 1.15; margin: 0;
    font-weight: 760; letter-spacing: -.015em; text-wrap: balance;
  }
  h1 .path { font-family: var(--mono); font-weight: 600; color: var(--app); font-size: .74em; }
  .lede { margin: 10px 0 0; color: var(--muted); max-width: 68ch; font-size: 14.5px; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 16px; }
  .legend .item { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .legend .swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }

  /* ---------- transit rail ---------- */
  .rail-shell { margin: 20px 0 4px; }
  .rail-band { position: relative; height: 15px; margin: 0 2px 3px; }
  .rail-band .cat {
    position: absolute; top: 3px; height: 9px; border-radius: 5px;
    background: color-mix(in srgb, var(--ohs) 22%, transparent);
    border: 1px solid color-mix(in srgb, var(--ohs) 45%, transparent);
  }
  .rail-band .cat-label {
    position: absolute; top: -14px; font-family: var(--mono); font-size: 10px;
    letter-spacing: .08em; color: var(--ohs); white-space: nowrap; transform: translateX(-2px);
  }
  .rail {
    position: relative; display: flex; gap: 0; align-items: center;
    padding: 8px 2px; overflow-x: auto; scrollbar-width: thin;
  }
  .rail::before {
    content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 2px;
    background: var(--hair); transform: translateY(-50%); z-index: 0;
  }
  .tick {
    position: relative; z-index: 1; flex: 1 0 auto; min-width: 20px;
    display: flex; justify-content: center; background: none; border: none;
    padding: 6px 0; cursor: pointer;
  }
  .tick .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--tc, var(--faint)); border: 2px solid var(--ground);
    box-shadow: 0 0 0 1px var(--hair);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .tick:hover .dot { transform: scale(1.25); }
  .tick.done .dot { opacity: .85; }
  .tick.current .dot {
    transform: scale(1.7);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc) 28%, transparent), 0 0 0 4px var(--card);
  }
  .tick:focus-visible { outline: 2px solid var(--app); outline-offset: 2px; border-radius: 6px; }

  /* ---------- console grid ---------- */
  .console {
    display: grid; grid-template-columns: minmax(268px, 360px) 1fr; gap: 18px;
    align-items: start; margin-top: 14px;
  }

  /* ---------- map ---------- */
  .map {
    background: var(--card); border: 1px solid var(--hair); border-radius: 14px;
    box-shadow: var(--shadow); padding: 14px 12px; position: sticky; top: 14px;
    max-height: calc(100vh - 32px); overflow-x: hidden; overflow-y: auto; scrollbar-width: thin;
  }
  .map h2 {
    font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--faint); margin: 2px 4px 10px; font-weight: 600;
  }
  .bc {
    border: 1px solid var(--hair); border-radius: 11px; padding: 9px 9px 5px;
    margin-bottom: 11px; transition: border-color .25s ease, background .25s ease, opacity .25s ease;
    background: color-mix(in srgb, var(--paper) 55%, transparent);
  }
  .bc.dim { opacity: .5; }
  .bc.active { border-color: color-mix(in srgb, var(--ohs) 55%, var(--hair)); background: var(--card); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ohs) 12%, transparent); }
  .bc-name {
    display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 13px;
    font-weight: 650; color: var(--ink); margin: 1px 2px 8px; letter-spacing: .02em;
  }
  .bc-name .badge {
    font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ohs);
    border: 1px solid color-mix(in srgb, var(--ohs) 40%, transparent); border-radius: 20px;
    padding: 1px 7px; margin-left: auto;
  }
  .grp { margin: 0 0 5px; }
  .grp-h {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em; color: var(--gc, var(--muted));
    padding: 3px 4px 2px; display: flex; align-items: center; gap: 6px;
  }
  .grp-h::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--gc, var(--muted)); flex: none; }
  .node {
    display: block; width: 100%; text-align: left; border: none; background: none;
    font-family: var(--mono); font-size: 12px; color: var(--muted); cursor: pointer;
    padding: 3px 6px 3px 18px; border-radius: 7px; line-height: 1.45; position: relative;
    overflow-wrap: anywhere; word-break: break-word;
  }
  .node::before {
    content: ""; position: absolute; left: 7px; top: 9px; width: 5px; height: 5px; border-radius: 50%;
    background: var(--nc, var(--faint)); opacity: .5;
  }
  .node:hover { background: var(--paper); color: var(--ink); }
  .node.grey { color: var(--grey-node); font-style: italic; }
  .node.grey::before { background: var(--grey-node); }
  .node.active {
    background: color-mix(in srgb, var(--nc) 13%, transparent); color: var(--ink); font-weight: 640;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--nc) 40%, transparent);
  }
  .node.active::before { opacity: 1; transform: scale(1.35); }
  .node:focus-visible { outline: 2px solid var(--app); outline-offset: 1px; }

  /* ---------- step card ---------- */
  .card {
    background: var(--card); border: 1px solid var(--hair); border-radius: 14px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .card-head { padding: 16px 20px 14px; border-bottom: 1px solid var(--hair); position: relative; }
  .card-head::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--lc, var(--faint));
  }
  .step-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .stepno { font-family: var(--mono); font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .chip {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 9px; border-radius: 20px; font-weight: 600;
    color: var(--lc); background: color-mix(in srgb, var(--lc) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--lc) 30%, transparent);
  }
  .chip.bc { color: var(--ink); background: var(--paper); border-color: var(--hair); }
  .chip.flag { color: var(--err); background: color-mix(in srgb, var(--err) 10%, transparent); border-color: color-mix(in srgb, var(--err) 32%, transparent); }
  .chip.cross { color: var(--ohs); background: color-mix(in srgb, var(--ohs) 10%, transparent); border-color: color-mix(in srgb, var(--ohs) 34%, transparent); }
  .filepath { font-family: var(--mono); font-size: 13px; color: var(--ink); margin: 11px 0 3px; font-weight: 620; word-break: break-all; }
  .card-title { font-size: 17px; font-weight: 680; margin: 4px 0 0; letter-spacing: -.01em; text-wrap: balance; }

  .card-body { padding: 16px 20px 20px; }
  .facts { display: grid; grid-template-columns: 1fr; gap: 1px; background: var(--hair); border: 1px solid var(--hair); border-radius: 11px; overflow: hidden; margin-bottom: 16px; }
  .fact { background: var(--card); padding: 10px 13px; display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: start; }
  .fact dt { font-family: var(--mono); font-size: 11px; color: var(--faint); letter-spacing: .04em; padding-top: 1px; }
  .fact dd { margin: 0; font-size: 13.5px; color: var(--ink); }
  .fact dd b { color: var(--dom); font-weight: 640; }
  .fact.dep dd { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .codewrap { border: 1px solid var(--hair); border-radius: 11px; overflow: hidden; background: #fbfcfe; }
  .codebar {
    display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-bottom: 1px solid var(--hair);
    background: var(--paper); font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--faint);
  }
  .codebar .lang { margin-left: auto; }
  pre.code { margin: 0; padding: 13px 15px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.62; tab-size: 4; scrollbar-width: thin; }
  pre.code code { white-space: pre; }
  .code .k { color: #0f62b0; font-weight: 600; }
  .code .s { color: #1e7a4b; }
  .code .c { color: #8592a0; font-style: italic; }
  .code .d { color: #b26b1e; }
  .code .n { color: #b5482e; }
  .code .key { color: #7c3aed; }   /* JSON 키 — 바이올렛 */
  .code .fn  { color: #2c6db0; }   /* 경로 · URL — 블루 */
  .code .p   { color: #93a0ac; }   /* 구두점 */

  .note {
    margin-top: 15px; padding: 11px 14px; border-radius: 10px; font-size: 13px; line-height: 1.55;
    background: color-mix(in srgb, var(--ohs) 7%, var(--card)); border: 1px solid color-mix(in srgb, var(--ohs) 26%, transparent);
    color: var(--ink);
  }
  .note.err { background: color-mix(in srgb, var(--err) 7%, var(--card)); border-color: color-mix(in srgb, var(--err) 26%, transparent); }
  .note b { color: var(--ohs); }
  .note.err b { color: var(--err); }
  .note .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; display: block; margin-bottom: 3px; opacity: .85; }

  /* ---------- nav ---------- */
  .nav { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
  .btn {
    font-family: var(--sans); font-size: 13.5px; font-weight: 600; cursor: pointer;
    padding: 9px 16px; border-radius: 9px; border: 1px solid var(--hair); background: var(--card); color: var(--ink);
    display: inline-flex; align-items: center; gap: 7px; transition: background .15s, border-color .15s, transform .1s;
  }
  .btn:hover:not(:disabled) { background: var(--paper); border-color: var(--faint); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); margin-left: auto; }
  .btn.primary:hover:not(:disabled) { background: #2c3742; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn:focus-visible { outline: 2px solid var(--app); outline-offset: 2px; }
  .counter { font-family: var(--mono); font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .kbd-hint { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-top: 9px; }
  .kbd { border: 1px solid var(--hair); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--paper); }

  /* ---------- responsive ---------- */
  @media (max-width: 940px) {
    .console { grid-template-columns: 1fr; }
    .map { position: static; max-height: 340px; order: 2; }
    .card { order: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
</style>

<div class="wrap">
  <header class="top">
    <p class="eyebrow">dddjango · DDD 4계층 온보딩</p>
    <h1>하나의 요청이 지나가는 길 &nbsp;<span class="path">POST /orders</span></h1>
    <p class="lede">주문 한 건을 만드는 요청이 <b>어떤 파일을 어떤 순서로</b> 지나가는지 33단계로 따라갑니다. 재고 확인·차감, 가격 계산, 결제, 그리고 <b>다른 바운디드 컨텍스트(catalog)를 넘나드는 왕복</b>까지 — DDD가 왜 이렇게 잘게 나누는지 각 정거장에서 설명합니다.</p>
    <div class="legend" id="legend"></div>
  </header>

  <div class="rail-shell">
    <div class="rail-band"><div class="cat" id="catBand"></div><span class="cat-label" id="catLabel">↳ catalog BC 왕복</span></div>
    <div class="rail" id="rail" role="tablist" aria-label="33단계 여정"></div>
  </div>

  <div class="console">
    <aside class="map" id="map" aria-label="파일트리 맵"></aside>

    <main class="card">
      <div class="card-head">
        <div class="step-meta" id="meta"></div>
        <div class="filepath" id="filepath"></div>
        <h2 class="card-title" id="title"></h2>
      </div>
      <div class="card-body">
        <dl class="facts" id="facts"></dl>
        <div class="codewrap">
          <div class="codebar"><span id="codefile">code</span><span class="lang" id="codelang">python</span></div>
          <pre class="code"><code id="code"></code></pre>
        </div>
        <div id="note"></div>
        <div class="nav">
          <button class="btn" id="prev">◀ 이전</button>
          <span class="counter" id="counter"></span>
          <button class="btn primary" id="next">다음 ▶</button>
        </div>
        <p class="kbd-hint">키보드 <span class="kbd">←</span> <span class="kbd">→</span> 로 이동 · 위 레일의 점을 눌러 바로 점프</p>
      </div>
    </main>
  </div>
</div>

<script>
"use strict";

/* ---------- layer meta ---------- */
const LAYERS = {
  http:  { label: "HTTP",          v: "--http" },
  pres:  { label: "presentation",  v: "--pres" },
  app:   { label: "application",   v: "--app"  },
  dom:   { label: "domain",        v: "--dom"  },
  infra: { label: "infra",         v: "--infra"},
  wire:  { label: "composition",   v: "--wire" },
  ohs:   { label: "OHS 계약",       v: "--ohs"  },
};
const cssv = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ---------- file-tree map ---------- */
const MAP = [
  { key: "orders", name: "orders BC", groups: [
    { layer: "pres", nodes: [
      { id: "o-router",     t: "orders_api_router.py" },
      { id: "o-controller", t: "presentation_layer/api/…/order_controller.py" },
      { id: "o-schema-in",  t: "presentation_layer/schema/schema_in.py" },
      { id: "o-schema-out", t: "presentation_layer/schema/schema_out.py" },
      { id: "o-error-out",  t: "presentation_layer/schema/error_out.py" },
    ]},
    { layer: "wire", nodes: [ { id: "o-comp", t: "composition_root.py" } ]},
    { layer: "app", nodes: [
      { id: "o-req",    t: "application_layer/place_order/dto/…_request.py" },
      { id: "o-cmd",    t: "application_layer/place_order/command/…_command.py" },
      { id: "o-result", t: "application_layer/place_order/dto/…_result.py" },
      { id: "o-query",  t: "application_layer/…/query/", grey: true },
      { id: "o-svc",    t: "application_layer/…/service/", grey: true },
      { id: "o-handler",t: "application_layer/…/handler/", grey: true },
    ]},
    { layer: "dom", nodes: [
      { id: "o-port-catalog", t: "domain_layer/order/port/product_catalog_port.py" },
      { id: "o-port-stock",   t: "domain_layer/order/port/product_stock_port.py" },
      { id: "o-port-pay",     t: "domain_layer/order/port/payment_gateway.py" },
      { id: "o-vo",           t: "domain_layer/order/value_object/quantity.py · money.py" },
      { id: "o-entity",       t: "domain_layer/order/entity/order_line.py" },
      { id: "o-spec",         t: "domain_layer/order/specification/…_specification.py" },
      { id: "o-dsvc",         t: "domain_layer/order/domain_service/pricing_service.py" },
      { id: "o-root",         t: "domain_layer/order/order.py  (애그리거트 루트)" },
      { id: "o-repo-if",      t: "domain_layer/order/repository/order_repository.py" },
      { id: "o-exc",          t: "domain_layer/order/exception.py" },
      { id: "o-event",        t: "domain_layer/order/event/", grey: true },
    ]},
    { layer: "infra", nodes: [
      { id: "o-acl-catalog", t: "infra_layer/acl/product_catalog_adapter.py" },
      { id: "o-acl-stock",   t: "infra_layer/acl/product_stock_adapter.py" },
      { id: "o-adapter-pay", t: "infra_layer/adapter/stripe_payment_gateway.py" },
      { id: "o-repo-impl",   t: "infra_layer/repository/django_order_repository.py" },
      { id: "o-orm",         t: "infra_layer/django_orders/models/order_model.py · order_line_model.py" },
      { id: "o-migrations",  t: "infra_layer/django_orders/migrations/", grey: true },
      { id: "o-admin",       t: "infra_layer/django_orders/admin/", grey: true },
    ]},
    { layer: "app", label: "test", nodes: [ { id: "o-test", t: "test/{unit,integration,e2e}/", grey: true } ]},
  ]},
  { key: "catalog", name: "catalog BC", badge: "다른 컨텍스트", groups: [
    { layer: "ohs", nodes: [
      { id: "c-ohs",       t: "published_service/catalog_service/catalog_service.py" },
      { id: "c-req-ct",    t: "…/contract/request_contract/get_products_request_contract.py" },
      { id: "c-resp-ct",   t: "…/contract/response_contract/get_products_response_contract.py" },
      { id: "c-exc-ct",    t: "…/contract/exception_contract/catalog_published_error.py" },
    ]},
    { layer: "wire", nodes: [ { id: "c-comp", t: "composition_root.py" } ]},
    { layer: "app", nodes: [ { id: "c-query", t: "application_layer/product_catalog/query/get_products_query.py" } ]},
    { layer: "dom", nodes: [
      { id: "c-root",    t: "domain_layer/product/product.py" },
      { id: "c-repo-if", t: "domain_layer/product/repository/product_repository.py" },
    ]},
    { layer: "infra", nodes: [
      { id: "c-repo-impl", t: "infra_layer/repository/django_product_repository.py" },
      { id: "c-orm",       t: "infra_layer/django_catalog/models/product_model.py" },
    ]},
  ]},
];

/* ---------- steps ---------- */
const S = (o) => o;
const STEPS = [
S({ n:1, bc:"orders", layer:"http", node:null, flags:["진입"],
  file:"HTTP 요청", title:"클라이언트가 주문을 요청한다",
  where:"앱 바깥 — 아직 어떤 파일도 아니다.",
  why:"고객이 상품 2종을 담아 주문을 보낸다. 이 JSON이 앞으로 <b>모든 계층을 통과</b>하며 도메인 객체로 바뀌고, 다시 JSON으로 돌아 나온다.",
  ddd:"바깥 세계는 HTTP·JSON만 안다. 우리 도메인 언어는 아직 등장하지 않았다.",
  dep:"—",
  lang:"http", codefile:"request",
  code:`POST /orders HTTP/1.1
Content-Type: application/json

{
  "customer_id": 42,
  "lines": [
    { "product_id": 1, "quantity": 2 },
    { "product_id": 7, "quantity": 1 }
  ]
}` }),

S({ n:2, bc:"orders", layer:"pres", node:"o-router", flags:[],
  file:"application/orders/orders_api_router.py", title:"BC의 HTTP 진입점을 등록한다",
  where:"presentation 계층의 라우팅 파일. 앱마다 하나.",

  dep:"→ ProductCatalogPort · Order · ProductStockPort · PaymentGateway · OrderRepository",
  lang:"python", codefile:"place_order_command.py",
  code:`class PlaceOrderCommand:
    def __init__(self, catalog: ProductCatalogPort, stock: ProductStockPort,
                 payment: PaymentGateway, orders: OrderRepository, pricing: PricingService):
        self._catalog, self._stock = catalog, stock
        self._payment, self._orders, self._pricing = payment, orders, pricing

    def execute(self, request: PlaceOrderRequest) -> PlaceOrderResult:
        with transaction.atomic():                                  # 트랜잭션 경계
            products = self._catalog.fetch(request.product_ids())   # ① 다른 BC 조회
            order = Order.place(request, products, self._pricing)   # ② 도메인 규칙
            self._stock.decrease(order.stock_demands())             # ③ 재고 차감
            self._payment.charge(order.total())                     # ④ 결제
            self._orders.save(order)                                # ⑤ 저장
            return PlaceOrderResult.of(order)` }),

/* ---------- python syntax highlight ---------- */
const KW = new Set(["def","class","return","if","else","elif","for","in","not","and","or",
  "with","raise","from","import","None","True","False","self","pass","async","await","try",
  "except","finally","lambda","yield","as","abstractmethod","ABC","dataclass","frozen"]);
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function highlight(src){
  let out = "", i = 0, n = src.length;
  while(i < n){
    const c = src[i];
    if(c === "#"){ let j = src.indexOf("\n", i); if(j < 0) j = n;
      out += `<span class="c">${esc(src.slice(i,j))}</span>`; i = j; continue; }
    if(c === '"' || c === "'"){
      const triple = src.substr(i,3) === c+c+c; const len = triple ? 3 : 1; let j = i + len;
      while(j < n){
        if(!triple && src[j] === "\n") break;
        if(src[j] === "\\"){ j += 2; continue; }
        if(triple ? src.substr(j,3) === c+c+c : src[j] === c){ j += triple ? 3 : 1; break; }
        j++;
      }
      out += `<span class="s">${esc(src.slice(i,j))}</span>`; i = j; continue; }
    if(c === "@"){ let j = i + 1; while(j < n && /[\w.]/.test(src[j])) j++;
      out += `<span class="d">${esc(src.slice(i,j))}</span>`; i = j; continue; }
    if(/[A-Za-z_]/.test(c)){ let j = i + 1; while(j < n && /\w/.test(src[j])) j++;
      const w = src.slice(i,j);
      out += KW.has(w) ? `<span class="k">${esc(w)}</span>` : esc(w); i = j; continue; }
    if(/[0-9]/.test(c)){ let j = i + 1; while(j < n && /[\w._]/.test(src[j])) j++;
      out += `<span class="n">${esc(src.slice(i,j))}</span>`; i = j; continue; }
    out += esc(c); i++;
  }
  return out;
}

  el.innerHTML = order.map(k => {
    const L = LAYERS[k];
    return `<span class="item"><span class="swatch" style="background:var(${L.v})"></span>${L.label}</span>`;
  }).join("");
})();

/* ---------- render: map ---------- */
(function renderMap(){
  const el = document.getElementById("map");
  let html = `<h2>파일트리 맵 · 2 BC</h2>`;
  for(const bc of MAP){
    html += `<div class="bc" data-bc="${bc.key}"><div class="bc-name">${bc.name}` +
            (bc.badge ? `<span class="badge">${bc.badge}</span>` : ``) + `</div>`;
    for(const g of bc.groups){
      const L = LAYERS[g.layer];
      const gname = g.label || L.label;
      html += `<div class="grp"><div class="grp-h" style="--gc:var(${L.v})">${gname}</div>`;
      for(const nd of g.nodes){
        const label = nd.t.replace(/([_/])/g, "$1<wbr>");   // 경로를 /·_ 에서 줄바꿈 허용
        html += `<button class="node${nd.grey ? " grey" : ""}" data-node="${nd.id}" ` +
                `style="--nc:var(${L.v})" ${nd.grey ? "tabindex=\"-1\"" : ""}>${label}</button>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }
  el.innerHTML = html;
  // clicking a live node jumps to its (first) step
  el.querySelectorAll(".node:not(.grey)").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-node");
      const idx = STEPS.findIndex(s => s.node === id);
      if(idx >= 0) go(idx);
    });
  });
})();

/* ---------- render: rail ---------- */
(function renderRail(){
  const rail = document.getElementById("rail");
  rail.innerHTML = STEPS.map((s,i) => {
    const L = LAYERS[s.layer];
    return `<button class="tick" data-i="${i}" role="tab" aria-label="스텝 ${s.n}: ${s.title}" ` +
           `style="--tc:var(${L.v})"><span class="dot"></span></button>`;
  }).join("");
  rail.querySelectorAll(".tick").forEach(t =>
    t.addEventListener("click", () => go(parseInt(t.getAttribute("data-i"),10))));
  // catalog band over steps 10..15 (indices 9..14)
  const band = document.getElementById("catBand");
  const first = 9, last = 14, total = STEPS.length;
  const leftPct = (first / total) * 100, widthPct = ((last - first + 1) / total) * 100;
  band.style.left = leftPct + "%";
  band.style.width = widthPct + "%";
  document.getElementById("catLabel").style.left = leftPct + "%";
})();

/* ---------- state + render ---------- */
let cur = 0;
const $ = (id) => document.getElementById(id);

function render(){
  const s = STEPS[cur];
  const L = LAYERS[s.layer];
  const lc = `var(${L.v})`;

  // head
  document.querySelector(".card-head").style.setProperty("--lc", lc);
  let chips = `<span class="stepno">STEP ${String(s.n).padStart(2,"0")} / ${STEPS.length}</span>` +
              `<span class="chip" style="--lc:${lc}">${L.label}</span>` +
              `<span class="chip bc">${s.bc} BC</span>`;
  for(const f of (s.flags||[])){
    const cls = /에러/.test(f) ? "flag" : (/경계|OHS|catalog|번역/.test(f) ? "cross" : "chip");
    chips += `<span class="chip ${cls==="chip"?"":cls}">${f}</span>`;
  }
  $("meta").innerHTML = chips;
  $("filepath").textContent = s.file;
  $("title").textContent = s.title;

  // facts
  $("facts").innerHTML =
    `<div class="fact"><dt>어디에</dt><dd>${s.where}</dd></div>` +
    `<div class="fact"><dt>왜 여기</dt><dd>${s.why}</dd></div>` +
    `<div class="fact"><dt>DDD 원칙</dt><dd>${s.ddd}</dd></div>` +
    `<div class="fact dep"><dt>무엇에만</dt><dd>${s.dep}</dd></div>`;

  // code
  $("codefile").textContent = s.codefile || "code";
  $("codelang").textContent = s.lang || "python";
  $("code").innerHTML = s.lang === "python" ? highlight(s.code) : highlightHttp(s.code);

  // note (boundary / error)
  let note = "";
  const crossing = (s.flags||[]).some(f => /경계/.test(f));
  const err = (s.flags||[]).some(f => /에러/.test(f));
  if(s.n === 9)  note = `<div class="note"><span class="lbl">BC 경계</span>지금부터 <b>orders → catalog</b> 컨텍스트로 넘어갑니다. 좌측 맵에서 활성 BC가 바뀝니다. 우리는 상대의 내부가 아니라 <b>공개 계약(OHS)</b>만 붙잡습니다.</div>`;
  else if(s.n === 16) note = `<div class="note"><span class="lbl">BC 경계</span><b>catalog → orders</b>로 돌아왔습니다. 상대의 계약 DTO를 우리 도메인 값으로 <b>번역</b>하는 이 한 줄이 두 BC를 느슨하게 유지합니다.</div>`;
  else if(err) note = `<div class="note err"><span class="lbl">에러 분기</span>재고가 부족하면 여기서 <b>OutOfStockError</b>가 발생 → 트랜잭션 전체 롤백 → 스텝 32에서 <b>409</b>로 번역됩니다. 성공 경로는 그대로 이어집니다.</div>`;
  $("note").innerHTML = note;

  // nav
  $("prev").disabled = cur === 0;
  $("next").disabled = cur === STEPS.length - 1;
  $("counter").textContent = `${s.n} / ${STEPS.length}`;

  // rail
  document.querySelectorAll(".tick").forEach((t,i) => {
    t.classList.toggle("current", i === cur);
    t.classList.toggle("done", i < cur);
    if(i === cur) t.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
  });

  // map: active BC + active node
  document.querySelectorAll(".bc").forEach(b =>
    b.classList.toggle("active", b.getAttribute("data-bc") === s.bc));
  document.querySelectorAll(".bc").forEach(b => {
    if(b.getAttribute("data-bc") !== s.bc) b.classList.add("dim");
    else b.classList.remove("dim");
  });
  document.querySelectorAll(".node").forEach(nd => nd.classList.remove("active"));
  if(s.node){
    const nd = document.querySelector(`.node[data-node="${s.node}"]`);
    if(nd){ nd.classList.add("active"); nd.scrollIntoView({block:"nearest", behavior:"smooth"}); }
  }
}

function highlightJsonLine(line){
  let out = "", i = 0, n = line.length;
  while(i < n){
    const c = line[i];
    if(c === '"'){                                   // 문자열 (키 또는 값)
      let j = i + 1;
      while(j < n && line[j] !== '"'){ if(line[j] === "\\") j++; j++; }
      j++;                                           // 닫는 따옴표 포함
      const str = line.slice(i, j);
      let k = j; while(k < n && line[k] === " ") k++;
      const isKey = line[k] === ":";                 // 다음이 ':' 이면 키
      out += `<span class="${isKey ? "key" : "s"}">${esc(str)}</span>`;
      i = j; continue;
    }
    if(/[0-9]/.test(c)){                             // 숫자
      let j = i + 1; while(j < n && /[0-9.]/.test(line[j])) j++;
      out += `<span class="n">${esc(line.slice(i,j))}</span>`; i = j; continue;
    }
    if("{}[]:,".includes(c)){ out += `<span class="p">${c}</span>`; i++; continue; }
    out += esc(c); i++;
  }
  return out;
}
function highlightHttp(src){
  return src.split("\n").map(line => {
    if(line.trimStart().startsWith("#"))            // 주석
      return `<span class="c">${esc(line)}</span>`;
    let m = line.match(/^(POST|GET|PUT|PATCH|DELETE)\s+(\S+)\s+(HTTP\/1\.1)$/);
    if(m)                                            // 요청 라인
      return `<span class="k">${m[1]}</span> <span class="fn">${esc(m[2])}</span> <span class="d">${m[3]}</span>`;
    m = line.match(/^(HTTP\/1\.1)\s+(\d{3})\s+(.+)$/);
    if(m)                                            // 상태 라인
      return `<span class="d">${m[1]}</span> <span class="k">${m[2]} ${esc(m[3])}</span>`;
    if(line.indexOf('"') === -1){
      m = line.match(/^([A-Za-z][A-Za-z-]*):\s*(.+)$/);
      if(m)                                          // 헤더
        return `<span class="key">${m[1]}</span><span class="p">:</span> ${esc(m[2])}`;
    }
    return highlightJsonLine(line);                  // JSON 바디
  }).join("\n");
}

function go(i){ cur = Math.max(0, Math.min(STEPS.length - 1, i)); render(); }

$("prev").addEventListener("click", () => go(cur - 1));
$("next").addEventListener("click", () => go(cur + 1));
document.addEventListener("keydown", (e) => {
  if(e.key === "ArrowLeft"){ go(cur - 1); }
  else if(e.key === "ArrowRight"){ go(cur + 1); }
});

render();
</script>
